function analyseTarget(se,d){
  // Pour multi-blason, utilise le blason dominant (non-postit) pour le rendu cible
  const domScoring = se.scoring==='postit' && hasAnyScoredVolee(se) ?
    (se.volees.find(v=>v.scoring && v.scoring!=='postit')||{}).scoring || se.scoring : se.scoring;
  const domCm = se.scoring==='postit' && hasAnyScoredVolee(se) ?
    (se.volees.find(v=>v.scoring && v.scoring!=='postit')||{}).blasonCm || se.blasonCm : se.blasonCm;
  const f=faceModel(domCm, domScoring); const R=f.R, vb=R*1.06;
  let rings="";
  for(let k=f.zones;k>=1;k--){ const sc=11-k; rings+=`<circle r="${k*f.ringW}" fill="${zoneHex(sc)}" stroke="#0004" stroke-width="${R*0.004}"/>`; }
  rings+=`<circle r="${f.xRadius}" fill="none" stroke="#0006" stroke-width="${R*0.004}"/>`;
  const arrows=flatArrows(se).filter(a=>a.x!=null);
  const dots=arrows.map(a=>`<circle cx="${a.x}" cy="${-a.y}" r="${R*0.022}" fill="#111" stroke="#D4943A" stroke-width="${R*0.008}" opacity="0.92"/>`).join("");
  // cercle de dispersion (~68%) centré sur PIM
  const scatter=`<circle cx="${d.mx}" cy="${-d.my}" r="${d.sdr}" fill="none" stroke="#5EB8D6" stroke-width="${R*0.006}" stroke-dasharray="${R*0.02} ${R*0.02}"/>`;
  // croix PIM
  const cs=R*0.06;
  const pim=`<g stroke="#E9E4D6" stroke-width="${R*0.008}">
      <line x1="${d.mx-cs}" y1="${-d.my}" x2="${d.mx+cs}" y2="${-d.my}"/>
      <line x1="${d.mx}" y1="${-d.my-cs}" x2="${d.mx}" y2="${-d.my+cs}"/></g>
    <circle cx="${d.mx}" cy="${-d.my}" r="${R*0.012}" fill="#E9E4D6"/>`;
  const dirH=d.mx>=0?"droite":"gauche", dirV=d.my>=0?"haut":"bas";
  return `
  <div class="saisie-layout" style="grid-template-columns:1fr">
    <div style="display:grid;grid-template-columns:1fr;gap:16px">
      <div class="targetwrap" style="max-width:400px">
        <svg viewBox="${-vb} ${-vb} ${vb*2} ${vb*2}">${rings}${scatter}${dots}${pim}</svg>
      </div>
      <div class="tlegend">
        <span><i style="background:#D4943A"></i>Point d'impact moyen (justesse)</span>
        <span><i style="background:#5EB8D6"></i>Cercle de dispersion ≈ 68 % (précision)</span>
      </div>
      <div class="metrics">
        <div class="metric"><div class="lab">Groupement (rayon moyen)</div><div class="val">${round(d.rmean)}<small>cm</small></div><div class="delta flat">étalement max ${round(d.spread)} cm</div></div>
        <div class="metric"><div class="lab">Écart-type H / V</div><div class="val" style="font-size:20px">${round(d.sdx)} / ${round(d.sdy)}<small>cm</small></div></div>
        <div class="metric"><div class="lab">Centrage (PIM → centre)</div><div class="val">${round(d.dCenter)}<small>cm</small></div><div class="delta flat">${round(Math.abs(d.mx))} ${dirH} · ${round(Math.abs(d.my))} ${dirV}</div></div>
        <div class="metric accent"><div class="lab">Score potentiel (recentré)</div><div class="val">${d.potential}<small> / ${d.actualPlotted}</small></div><div class="delta ${d.gain>0?'up':'flat'}">${d.gain>0?`+${d.gain} pts à gagner par le centrage`:'déjà centré'}</div></div>
        ${d.angMrad!=null?`<div class="metric"><div class="lab">Déviation angulaire</div><div class="val">${round(d.angMrad,1)}<small>mrad</small></div><div class="delta flat">comparable entre distances</div></div>
        <div class="metric"><div class="lab">Rating estimé</div><div class="val">${round(d.ratingH,0)}</div><div class="delta flat">méthode handicap · plus bas = mieux</div></div>`:''}
      </div>
    </div>
  </div>`;
}
function zoneDistHTML(se,st){
  // Pour multi-blason, utilise le scoring dominant (non-postit)
  const scoring = se.scoring==='postit' && hasAnyScoredVolee(se) ?
    (se.volees.find(v=>v.scoring && v.scoring!=='postit')||{}).scoring || se.scoring : se.scoring;
  const maxS=maxScoreForScoring(scoring), minS=minScoreForScoring(scoring);
  const max=Math.max(1,...Object.values(st.dist));
  let rows="";
  for(let v=maxS;v>=minS;v--){
    const c=st.dist[v]||0; const pct=c/st.n*100;
    rows+=`<div class="bar-row">
      <div class="zl" style="color:${zoneColor(v)}">${v}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${c/max*100}%;background:${zoneHex(v)}"></div></div>
      <div class="zc">${c} · ${round(pct)}%</div></div>`;
  }
  // M (raté)
  const cm=st.dist[0]||0; if(cm>0){
    rows+=`<div class="bar-row"><div class="zl" style="color:#4a5a55">M</div>
      <div class="bar-track"><div class="bar-fill" style="width:${cm/max*100}%;background:#4a5a55"></div></div>
      <div class="zc">${cm} · ${round(cm/st.n*100)}%</div></div>`;
  }
  return rows;
}
function lineChartHTML(vals,opts={}){
  if(!vals.length) return `<div class="hint">Pas de données.</div>`;
  const W=100, H=42, pad=3;
  const min=Math.min(...vals), max=Math.max(...vals);
  const rng=(max-min)||1;
  const pts=vals.map((v,i)=>{
    const x=pad+(vals.length===1?0.5:i/(vals.length-1))*(W-pad*2);
    const y=H-pad-((v-min)/rng)*(H-pad*2);
    return [x,y];
  });
  const path=pts.map((p,i)=>(i?"L":"M")+round(p[0],2)+" "+round(p[1],2)).join(" ");
  const area=`M${pts[0][0]} ${H} `+pts.map(p=>"L"+round(p[0],2)+" "+round(p[1],2)).join(" ")+` L${pts[pts.length-1][0]} ${H} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${round(p[0],2)}" cy="${round(p[1],2)}" r="0.9" fill="#D4943A"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:130px">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4943A" stop-opacity=".28"/><stop offset="1" stop-color="#D4943A" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ag)"/>
    <path d="${path}" fill="none" stroke="#D4943A" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px"><span>volée 1</span><span>${opts.ylabel||''} · min ${min} / max ${max}</span><span>volée ${vals.length}</span></div>`;
}
function diagListHTML(D){
  const item=(cls,ic,t,p)=>`<div class="diag-item ${cls}"><div class="ic">${ic}</div><div class="tx"><h4>${t}</h4><p>${p}</p></div></div>`;
  const icF=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
  const icX=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5m0 3h.01"/><circle cx="12" cy="12" r="9"/></svg>`;
  const icA=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>`;
  let h="";
  D.forces.forEach(x=>h+=item("force",icF,x[0],x[1]));

  return `<div class="diag">${h}</div>`;
}

    img.onload=()=>{
      const scale=Math.min(1,maxW/img.naturalWidth);
      const w=Math.round(img.naturalWidth*scale), h=Math.round(img.naturalHeight*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>toast("Impossible de lire cette image");
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- VISEURS (fiche détaillée + réglages multi-distances + courbe prévisionnelle) ---------- */
const VISEUR_TYPES=["Viseur classique (curseur)","Viseur scope (poulie)","Viseur micro-métrique","Autre"];
const CONDITIONS_TIR=["Salle","Extérieur"];

/* régression polynomiale (degré 1 ou 2) par moindres carrés, sans dépendance externe */
function polyFit(points,degree){
  const n=points.length;
  if(degree===1){
    if(n<2) return null;
    let sx=0,sy=0,sxx=0,sxy=0;
    points.forEach(p=>{sx+=p.x;sy+=p.y;sxx+=p.x*p.x;sxy+=p.x*p.y;});
    const denom=n*sxx-sx*sx; if(Math.abs(denom)<1e-9) return null;
    const b=(n*sxy-sx*sy)/denom, a=(sy-b*sx)/n;
    return [a,b];
  }
  if(n<3) return null;
  let S0=n,S1=0,S2=0,S3=0,S4=0,T0=0,T1=0,T2=0;
  points.forEach(p=>{ const x=p.x,y=p.y,x2=x*x; S1+=x;S2+=x2;S3+=x2*x;S4+=x2*x2; T0+=y;T1+=x*y;T2+=x2*y; });
  const A=[[S0,S1,S2],[S1,S2,S3],[S2,S3,S4]], B=[T0,T1,T2];
  function det3(m){ return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1]) - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0]) + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]); }
  const D=det3(A); if(Math.abs(D)<1e-9) return null;
  const repl=(col,vals)=>A.map((row,i)=>row.map((v,j)=>j===col?vals[i]:v));
  return [det3(repl(0,B))/D, det3(repl(1,B))/D, det3(repl(2,B))/D];
}
function evalPoly(c,x){ if(!c) return null; return c.length===2? c[0]+c[1]*x : c[0]+c[1]*x+c[2]*x*x; }

          ${v.photo?`<img src="${v.photo}" style="width:100%;height:100%;object-fit:cover">`:'<span style="font-size:26px">🎯</span>'}
        </div>

function viseurCurveHTML(v){
  const all=v.reglages||[];
  const pts=all.filter(r=>r.distance!=null && r.reglage!=null);
  const incomplete=all.filter(r=>(r.distance!=null)!==(r.reglage!=null)); // l'un des deux champs est renseigné, pas l'autre
  const warnIncomplete = incomplete.length? `<div class="hint" style="margin-bottom:10px;color:var(--warn)">⚠ ${incomplete.length} réglage(s) incomplet(s) (distance ou réglage manquant) ignoré(s) dans la courbe — complète les deux champs pour qu'ils comptent.</div>` : '';
  if(!pts.length) return warnIncomplete+`<div class="hint">Ajoute au moins un couple distance/réglage complet pour générer une courbe.</div>`;
  const groups={ Salle: pts.filter(p=>p.condition==='Salle'), 'Extérieur': pts.filter(p=>p.condition==='Extérieur') };
  const colors={ Salle:'#5FB8D6', 'Extérieur':'#D4943A' };
  const singlePointNotes = Object.entries(groups).filter(([,g])=>g.length===1)
    .map(([label])=>`<div class="hint">Un seul réglage complet en <b>${label}</b> — ajoutes-en un second pour tracer une courbe sur cette condition (ce point s'affiche seul en attendant).</div>`).join("");
  const allX=pts.map(p=>p.distance), allY=pts.map(p=>p.reglage);
  let minX=Math.min(...allX), maxX=Math.max(...allX), minY=Math.min(...allY), maxY=Math.max(...allY);
  if(minX===maxX){ minX-=5; maxX+=5; }
  if(minY===maxY){ minY-=1; maxY+=1; }
  const padX=(maxX-minX)*0.15, padY=(maxY-minY)*0.2;
  const dispMinX=Math.max(0,minX-padX), dispMaxX=maxX+padX, dispMinY=minY-padY, dispMaxY=maxY+padY;
  const W=100,H=56,pad=9;
  const sx=x=>pad+(x-dispMinX)/(dispMaxX-dispMinX)*(W-2*pad);
  const sy=y=>H-pad-(y-dispMinY)/(dispMaxY-dispMinY)*(H-2*pad);
  let svg=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2E4562" stroke-width="0.4"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#2E4562" stroke-width="0.4"/>`;
  Object.entries(groups).forEach(([label,gpts])=>{
    if(!gpts.length) return;
    const fitPts=gpts.map(p=>({x:p.distance,y:p.reglage}));
    const gminX=Math.min(...fitPts.map(p=>p.x)), gmaxX=Math.max(...fitPts.map(p=>p.x));
    let coeffs=fitPts.length>=3?polyFit(fitPts,2):null;
    if(!coeffs && fitPts.length>=2) coeffs=polyFit(fitPts,1);
    if(coeffs){
      const ext=Math.max(5,(gmaxX-gminX)*0.25);
      const domMin=Math.max(0,gminX-ext), domMax=gmaxX+ext, steps=30;
      let d='';
      for(let i=0;i<=steps;i++){
        const x=domMin+(domMax-domMin)*i/steps, y=evalPoly(coeffs,x);
        d+=(i===0?'M':'L')+round(sx(x),2)+' '+round(sy(y),2)+' ';
      }
      svg+=`<path d="${d}" fill="none" stroke="${colors[label]}" stroke-width="0.8" stroke-dasharray="2,1.4" opacity="0.85"/>`;
    }
    gpts.forEach(p=>{ svg+=`<circle cx="${round(sx(p.distance),2)}" cy="${round(sy(p.reglage),2)}" r="1.7" fill="${colors[label]}" stroke="#0b0f0e" stroke-width="0.35"/>`; });
  });
  const legend=Object.entries(groups).filter(([,g])=>g.length).map(([label])=>`<span><i style="background:${colors[label]}"></i>${label}</span>`).join('');
  return warnIncomplete+`<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:180px;width:100%">${svg}</svg>
    <div class="tlegend" style="margin-top:8px">${legend}</div>
    ${singlePointNotes}
    <div class="subnote">Courbe indicative en pointillés, ajustée sur tes propres réglages (régression quadratique dès 3 points par condition, linéaire à partir de 2). Extrapolation prudente au-delà de tes distances déjà réglées — vérifie toujours en conditions réelles, notamment avec du vent.</div>`;
}
function viseurReglagesTableHTML(v){
  const rows=v.reglages||[];
  if(!rows.length) return `<div class="hint">Aucun réglage enregistré.</div>`;
  const sorted=[...rows].sort((a,b)=>(a.condition||'').localeCompare(b.condition||'')||(a.distance-b.distance));
  return `<div class="slist">`+sorted.map(r=>`
    <div class="volee-row" style="align-items:center">
      <div class="arrows" style="flex-direction:column;align-items:flex-start;gap:2px">
        <b class="mono">${r.distance!=null?r.distance+' m':'—'} <span class="tag" style="margin-left:6px">${esc(r.condition||'')}</span></b>
        ${r.vent?`<span class="hint">Vent : ${esc(r.vent)}</span>`:''}
      </div>
      <span class="tot mono" style="color:var(--gold)">${r.reglage!=null?r.reglage:'—'}</span>
    </div>`).join("")+`</div>`;
}

let VISEUR_FORM=null, VISEUR_PHOTO_PENDING=null, VISEUR_REGLAGES_PENDING=[], VISEUR_EDIT_ID=null;
function openViseurForm(id){
  const v = id? S.materiel.viseurs.find(x=>x.id===id) : null;
  VISEUR_FORM = { nom:v?v.nom:'', type:v?v.type:VISEUR_TYPES[0], grossissement:v?v.grossissement:'', typeVerre:v?v.typeVerre:'', commentaire:v?v.commentaire:'' };
  VISEUR_PHOTO_PENDING = v&&v.photo? v.photo : null;
  VISEUR_REGLAGES_PENDING = v&&v.reglages? JSON.parse(JSON.stringify(v.reglages)) : [];
  VISEUR_EDIT_ID = id||null;
  renderViseurFormModal();
}
function snapshotViseurSimpleFields(){
  const g=sel=>{ const el=$(sel); return el?el.value:null; };
  let x;
  if((x=g("#viseur-nom"))!=null) VISEUR_FORM.nom=x;
  if((x=g("#viseur-type"))!=null) VISEUR_FORM.type=x;
  if((x=g("#viseur-gross"))!=null) VISEUR_FORM.grossissement=x;
  if((x=g("#viseur-verre"))!=null) VISEUR_FORM.typeVerre=x;
  if((x=g("#viseur-commentaire"))!=null) VISEUR_FORM.commentaire=x;
}
function addReglageRow(){ snapshotViseurSimpleFields(); VISEUR_REGLAGES_PENDING.push({id:uid(),distance:null,condition:'Salle',vent:'',reglage:null}); renderViseurFormModal(); }
function removeReglageRow(i){ snapshotViseurSimpleFields(); VISEUR_REGLAGES_PENDING.splice(i,1); renderViseurFormModal(); }
function handleViseurPhoto(ev){
  const file=ev.target.files[0]; if(!file) return;

    VISEUR_PHOTO_PENDING=url;

  });
}
function renderViseurFormModal(){
  const editing=!!VISEUR_EDIT_ID;
  const rows=VISEUR_REGLAGES_PENDING.map((r,i)=>{
    const incomplete = (r.distance!=null) !== (r.reglage!=null); // un seul des deux champs rempli
    return `
    <div style="border-left:3px solid ${incomplete?'#D4943A':'transparent'};padding-left:${incomplete?'8px':'0'};margin-bottom:8px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;align-items:end;gap:8px">
        <div class="field"><label>Distance (m)</label><input type="number" step="1" value="${r.distance!=null?r.distance:''}" oninput="VISEUR_REGLAGES_PENDING[${i}].distance=this.value?parseFloat(this.value):null"></div>
        <div class="field"><label>Condition</label><select onchange="VISEUR_REGLAGES_PENDING[${i}].condition=this.value">${CONDITIONS_TIR.map(c=>`<option ${r.condition===c?'selected':''}>${c}</option>`).join("")}</select></div>
        <div class="field"><label>Vent (optionnel)</label><input value="${esc(r.vent||'')}" placeholder="Ex. 3 face" oninput="VISEUR_REGLAGES_PENDING[${i}].vent=this.value"></div>

      </div>

        <div class="field"><label>Type de viseur</label><select id="viseur-type">${VISEUR_TYPES.map(t=>`<option ${VISEUR_FORM.type===t?'selected':''}>${t}</option>`).join("")}</select></div>

      <div class="field"><label>Type de verre</label><input id="viseur-verre" value="${esc(VISEUR_FORM.typeVerre)}" placeholder="Ex. loupe, fibre optique, plat…"></div>
      <div class="field"><label>Commentaire / annotations</label><textarea id="viseur-commentaire" rows="2" placeholder="Notes libres…">${esc(VISEUR_FORM.commentaire)}</textarea></div>

function saveViseur(){
  snapshotViseurSimpleFields();
  const nom=VISEUR_FORM.nom.trim();
  if(!nom){ toast("Donne un nom à ce viseur"); return; }
  const incomplete = VISEUR_REGLAGES_PENDING.filter(r=>(r.distance!=null)!==(r.reglage!=null)).length;
  const reglages=VISEUR_REGLAGES_PENDING.filter(r=>r.distance!=null||r.reglage!=null).map(r=>({id:r.id||uid(),distance:r.distance,condition:r.condition||'Salle',vent:(r.vent||'').trim(),reglage:r.reglage}));
  const data={ nom, type:VISEUR_FORM.type, grossissement:VISEUR_FORM.grossissement.trim(), typeVerre:VISEUR_FORM.typeVerre.trim(), commentaire:VISEUR_FORM.commentaire.trim(), photo:VISEUR_PHOTO_PENDING, reglages };
  let finalId;
  if(VISEUR_EDIT_ID){ Object.assign(S.materiel.viseurs.find(x=>x.id===VISEUR_EDIT_ID),data); finalId=VISEUR_EDIT_ID; }
  else { data.id=uid(); S.materiel.viseurs.push(data); finalId=data.id; }
  S.ui.viseurDetailId=finalId;
  saveState(); closeModal();
  toast(incomplete>0 ? `Viseur enregistré — ${incomplete} réglage(s) incomplet(s) absent(s) de la courbe` : "Viseur enregistré");
  renderMateriel();
}
function deleteViseur(id){

function confirmDeleteViseur(id){
  S.materiel.viseurs=S.materiel.viseurs.filter(x=>x.id!==id);

  saveState(); closeModal(); toast("Viseur supprimé"); renderMateriel();

      <label class="btn" style="justify-content:center;cursor:pointer">⬆︎ Importer un JSON<input type="file" accept="application/json" style="display:none" onchange="importJSON(event)"></label>

function exportJSON(){ dl(JSON.stringify(S,null,2),`sagitta-${new Date().toISOString().slice(0,10)}.json`,"application/json"); toast("Export JSON généré"); }
function exportCSV(){
  const rows=[["date","discipline","distance_m","arc","blason_cm","cotation","fleches","total","moyenne_fl","taux10_pct","X","tauxX_pct","groupement_cm","mrad","rating_estime","PIM_dist_cm","score_potentiel_gain","clicker_s"]];
  [...S.seances].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(se=>{
    const st=seanceStats(se);
    rows.push([se.date,se.discipline,se.distance,se.arcType,se.blasonCm,se.scoring,st.n,st.total,round(st.avg,3),round(st.tenRate,1),st.xs,round(st.xRate,1),st.disp?round(st.disp.rmean,2):"",st.disp&&st.disp.angMrad!=null?round(st.disp.angMrad,2):"",st.disp&&st.disp.ratingH!=null?round(st.disp.ratingH,1):"",st.disp?round(st.disp.dCenter,2):"",st.disp?st.disp.gain:"",se.clickerTime||""]);
  });
  const csv=rows.map(r=>r.map(c=>{const s=(""+c);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\n");
  dl(csv,`sagitta-seances-${new Date().toISOString().slice(0,10)}.csv`,"text/csv");
  toast("Export CSV généré");
}
function dl(content,name,type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function importJSON(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!data.seances) throw 0; S=Object.assign(defaultState(),data); if(!S.ui)S.ui={view:"seances"}; saveState(); closeModal(); toast("Données importées"); setView("seances"); }catch(e){ toast("Fichier invalide"); } };
  r.readAsText(file);
}
function resetAll(){ modal(`<h3>Tout effacer ?</h3><p class="hint">Toutes tes séances seront supprimées définitivement. Pense à exporter d'abord.</p><div class="btnrow" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" onclick="openData()">Annuler</button><button class="btn danger" onclick="doReset()">Effacer</button></div>`); }
function doReset(){ S=defaultState(); saveState(); closeModal(); toast("Réinitialisé"); setView("seances"); }

/* ---------- DÉMO ---------- */
function loadDemo(){
  // séance réaliste tir en salle 18 m, blason 40, groupe légèrement décalé haut-droite
  const se={ id:uid(), date:new Date().toISOString().slice(0,10), discipline:"Salle 18 m", distance:18, arcType:"Arc classique", blasonCm:40, scoring:"10z", flechesParVolee:6, nbVolees:10, note:"Séance de démonstration", volees:[] };
  const f=faceModel(40,"10z");
  // biais moyen : +3.2cm droite, +4.5cm haut ; dispersion sd ~3.5cm ; légère fatigue
  function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  for(let e=0;e<10;e++){
    const fatigue=e>6?1.5:1; // dispersion augmente en fin
    const fl=[];
    for(let a=0;a<6;a++){
      const x=3.2+gauss()*3.4*fatigue, y=4.5+gauss()*3.4*fatigue;
      const r=Math.hypot(x,y); const sc=scoreFromRadius(r,40,"10z");
      fl.push({v:sc.v,isX:sc.isX,x:round(x,2),y:round(y,2)});
    }
    fl.sort((a,b)=>b.v-a.v);
    se.volees.push({fleches:fl});
  }
  S.seances.push(se); saveState(); toast("Séance de démonstration ajoutée");
  openAnalyse(se.id);
}
