<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0C1420">
<title>Sagitta — Carnet de performance & coaching au tir à l'arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1420; --bg2:#08101A; --panel:#142133; --panel2:#1A2A40; --line:#243650; --line2:#2E4562;
  --ink:#E9E4D6; --muted:#8A96A8; --muted2:#5E7085;
  --gold:#D4943A; --gold-soft:#E8A94E;
  --wa-gold:#F6D33C; --wa-red:#E23B2E; --wa-blue:#2FA4DE; --wa-black:#161616; --wa-white:#EFEBDD;
  --good:#5EB8D6; --warn:#D4943A; --bad:#E8715B; --info:#5FB8D6;
  --r:14px; --rs:10px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Archivo',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(212,148,58,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(30,100,180,.07), transparent 60%),
    var(--bg);
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; padding-bottom:84px;
}
h1,h2,h3,h4{font-family:var(--disp);margin:0;line-height:1.15;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--body);font-size:15px}
.eyebrow{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--muted)}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg2),rgba(11,18,16,.86));backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;flex:0 0 auto}
.brand .name{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:.02em}
.brand .name b{color:var(--gold)}
.brand .sub{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-family:var(--disp);font-weight:600;margin-top:-2px}
.topbar .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- nav (bottom on mobile) ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:linear-gradient(0deg,var(--bg2),rgba(11,18,16,.9));backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted2);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.nav button svg{width:22px;height:22px}
.nav button.active{color:var(--gold)}
.nav button.active svg{filter:drop-shadow(0 0 6px rgba(212,148,58,.35))}

/* ---------- panels & cards ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel + .panel{margin-top:14px}
.grid{display:grid;gap:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section-head h2{font-size:22px}
.hint{color:var(--muted);font-size:13px}

/* metric tiles */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rs);padding:14px}
.metric .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-family:var(--disp);font-weight:700}
.metric .val{font-family:var(--mono);font-weight:600;font-size:26px;margin-top:6px;line-height:1;color:var(--ink)}
.metric .val small{font-size:13px;color:var(--muted);font-weight:400}
.metric .delta{font-size:11.5px;margin-top:6px;font-family:var(--mono)}
.metric.accent{border-color:rgba(212,148,58,.4);background:linear-gradient(180deg,rgba(212,148,58,.08),var(--panel2))}
.metric.accent .val{color:var(--gold)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:11px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,var(--gold),#B87D2F);color:#1a0e04;border-color:transparent}
.btn.primary:hover{filter:brightness(1.06);color:#20160a}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.field input,.field select,.field textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}

/* list */
.slist{display:flex;flex-direction:column;gap:10px}
.scard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:.15s;text-align:left;width:100%}
.scard:hover{border-color:var(--line2);transform:translateX(2px)}
.scard .day{flex:0 0 auto;width:52px;text-align:center}
.scard .day .d{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--gold)}
.scard .day .m{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}
.scard .meta{flex:1;min-width:0}
.scard .meta .t{font-family:var(--disp);font-weight:700;font-size:15px}
.scard .meta .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sc{flex:0 0 auto;text-align:right}
.scard .sc .big{font-family:var(--mono);font-weight:600;font-size:20px}
.scard .sc .avg{font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.02em}

/* empty */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.5;margin-bottom:14px}
.empty h3{font-size:18px;color:var(--ink);margin-bottom:6px}

/* target + scoring */
.saisie-layout{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:820px){.saisie-layout{grid-template-columns:minmax(0,1fr) 340px}}
.targetwrap{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1/1}
.targetwrap svg{width:100%;height:100%;display:block;touch-action:none;border-radius:50%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.targetzoom{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1/1;overflow:hidden;border-radius:50%;box-shadow:0 8px 30px rgba(0,0,0,.4);background:#0b0f0e;touch-action:none;cursor:grab}
.targetzoom.panning{cursor:grabbing}
.zoomlayer{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0}
.zoomlayer svg{width:100%;height:100%;display:block}
.zoomctrls{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoomctrls button{width:32px;height:32px;border-radius:9px;background:rgba(14,22,20,.78);backdrop-filter:blur(4px);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.zoomctrls button:active{background:rgba(212,148,58,.3);color:var(--gold)}
.zoomhint{position:absolute;left:8px;bottom:8px;font-size:10px;color:rgba(233,228,214,.65);background:rgba(14,22,20,.55);padding:3px 7px;border-radius:7px;pointer-events:none;font-family:var(--body);transition:opacity .2s}
.hexcell{cursor:pointer;transition:opacity .1s,transform .1s;transform-box:fill-box;transform-origin:center}
.hexcell:hover{opacity:.85}
.hexcell:active{opacity:.65}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{padding:14px 0;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-weight:600;font-size:17px;transition:.12s}
.pad button:hover{border-color:var(--gold);color:var(--gold)}
.pad button.miss{color:var(--muted)}
.pad button.x{color:var(--wa-gold);border-color:rgba(246,211,60,.4)}
.endstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.arrowchip{font-family:var(--mono);font-weight:600;font-size:14px;min-width:34px;height:34px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.arrowchip.filled{background:var(--panel2)}
.volee-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.volee-row .n{font-family:var(--mono);color:var(--muted);width:26px;font-size:13px}
.volee-row .arrows{flex:1;display:flex;gap:5px;flex-wrap:wrap}
.volee-row .tot{font-family:var(--mono);font-weight:600;width:42px;text-align:right}
.mini-arrow{font-family:var(--mono);font-size:12.5px;padding:2px 7px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}

/* target legend */
.tlegend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted)}
.tlegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* charts */
.chart{width:100%;overflow:visible}
.bar-row{display:grid;grid-template-columns:34px 1fr 42px;align-items:center;gap:10px;margin:5px 0}
.bar-row .zl{font-family:var(--mono);font-size:13px;text-align:right;font-weight:600}
.bar-track{height:16px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-row .zc{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}

/* diagnostic */
.diag{display:flex;flex-direction:column;gap:12px}
.diag-item{display:flex;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.diag-item .ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.diag-item.force .ic{background:rgba(111,207,151,.15);color:var(--good)}
.diag-item.faible .ic{background:rgba(232,113,91,.15);color:var(--bad)}
.diag-item.axe .ic{background:rgba(212,148,58,.15);color:var(--gold)}
.diag-item .tx h4{font-size:14px;margin-bottom:3px}
.diag-item .tx p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.diag-item .tx b{color:var(--ink);font-weight:600}

/* pill selectors */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);background:var(--panel2)}
.pill.on{border-color:var(--gold);color:var(--gold);background:rgba(212,148,58,.08)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,9,8,.72);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:18px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;max-width:460px;width:100%;padding:22px;max-height:88vh;overflow:auto}
.modal h3{font-size:19px;margin-bottom:14px}

/* banner */
.banner{background:linear-gradient(90deg,rgba(232,113,91,.14),transparent);border:1px solid rgba(232,113,91,.3);border-radius:12px;padding:11px 14px;font-size:13px;color:#f0b6a8;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.banner svg{flex:0 0 auto;margin-top:1px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--ink);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

.subnote{font-size:12px;color:var(--muted2);margin-top:8px;line-height:1.5}
.divider{height:1px;background:var(--line);margin:18px 0}
a.link{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(212,148,58,.3)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
</style>
<style>
/* ---------- intro cinématique Teahupoo (vague SVG + effets) ---------- */
#intro{
  position:fixed;inset:0;z-index:500;background:#040A18;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:opacity .7s ease;
}
#intro.fadeout{opacity:0;pointer-events:none}
#intro .wave-scene{position:absolute;inset:0;overflow:hidden}
#intro .wave-scene svg{width:100%;height:100%;display:block}
#intro .ocean-bg{opacity:0}
#intro.play .ocean-bg{animation:i-oceanIn 5.7s ease-out forwards}
@keyframes i-oceanIn{0%{opacity:0}8%{opacity:1}100%{opacity:1}}
#intro .wave-main{transform:translateX(110%);opacity:0}
#intro.play .wave-main{animation:i-waveRoll 5.7s cubic-bezier(.22,.68,.36,1) forwards}
@keyframes i-waveRoll{
  0%{transform:translateX(110%) scaleY(.85);opacity:0}
  6%{opacity:1}
  38%{transform:translateX(-5%) scaleY(1.05)}
  50%{transform:translateX(-12%) scaleY(1)}
  100%{transform:translateX(-15%) scaleY(1)}
}
#intro .wave-curl{transform:translateX(120%);opacity:0}
#intro.play .wave-curl{animation:i-curl 5.7s cubic-bezier(.25,.7,.35,1) forwards}
@keyframes i-curl{
  0%{transform:translateX(120%) rotate(0);opacity:0}
  8%{opacity:.9}
  42%{transform:translateX(-2%) rotate(-3deg)}
  55%{transform:translateX(-10%) rotate(-2deg)}
  100%{transform:translateX(-12%) rotate(-1deg)}
}
#intro .foam{opacity:0}
#intro.play .foam{animation:i-foam 5.7s ease-in-out forwards}
@keyframes i-foam{
  0%,28%{opacity:0}
  38%{opacity:.9}50%{opacity:.6}62%{opacity:.85}
  78%{opacity:.5}100%{opacity:.55}
}
#intro .spray{opacity:0;transform-origin:40% 30%}
#intro.play .spray{animation:i-spray 5.7s ease-out forwards}
@keyframes i-spray{
  0%,20%{opacity:0;transform:scale(.4) translateY(20px)}
  32%{opacity:.95;transform:scale(1.1) translateY(-30px)}
  50%{opacity:.7;transform:scale(1.3) translateY(-60px)}
  70%{opacity:.2;transform:scale(1.5) translateY(-90px)}
  100%{opacity:0;transform:scale(1.6) translateY(-100px)}
}
#intro .sun-glow{opacity:0}
#intro.play .sun-glow{animation:i-sun 5.7s ease-in-out forwards}
@keyframes i-sun{
  0%{opacity:0}12%{opacity:.6}30%{opacity:.45}
  48%{opacity:.7}66%{opacity:.5}100%{opacity:.55}
}
#intro .barrel-light{opacity:0}
#intro.play .barrel-light{animation:i-barrel 5.7s ease-in-out forwards}
@keyframes i-barrel{
  0%,30%{opacity:0}
  42%{opacity:.9}55%{opacity:.6}68%{opacity:.85}100%{opacity:.7}
}
#intro .flash-wave{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 60% at 35% 50%,rgba(200,230,255,.9),rgba(60,140,200,.4) 50%,transparent 80%);
  mix-blend-mode:screen;opacity:0;
}
#intro.play .flash-wave{animation:i-flashW 5.7s linear forwards}
@keyframes i-flashW{0%,65%{opacity:0}68%{opacity:.8}73%{opacity:.15}78%{opacity:.4}84%,100%{opacity:0}}
#intro .ititle{
  position:absolute;top:7%;left:0;right:0;text-align:center;pointer-events:none;
  font-family:'Archivo','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:clamp(30px,6vw,52px);
  text-transform:uppercase;color:#E8F0FF;letter-spacing:.28em;opacity:0;
  text-shadow:0 0 18px rgba(30,120,200,.9),0 0 50px rgba(212,148,58,.6);
}
#intro .iversion{
  position:absolute;top:calc(7% + clamp(38px,7vw,60px));left:0;right:0;text-align:center;pointer-events:none;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;font-size:clamp(10px,1.8vw,14px);
  text-transform:uppercase;color:rgba(180,210,240,.75);letter-spacing:.22em;opacity:0;
  text-shadow:0 0 10px rgba(30,120,200,.5);
}
#intro.play .ititle{animation:i-titleT 5.7s ease-out forwards}
#intro.play .iversion{animation:i-verT 5.7s ease-out forwards}
@keyframes i-titleT{0%{opacity:0;letter-spacing:.55em}10%{opacity:1;letter-spacing:.28em}85%{opacity:1}100%{opacity:1}}
@keyframes i-verT{0%,14%{opacity:0}22%{opacity:.85}85%{opacity:.85}100%{opacity:.85}}
#intro .skip{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:5;
  background:rgba(8,20,40,.72);border:1px solid #2FA4DE;color:#C0DEFF;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  padding:10px 22px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);
}
#intro .skip:hover{background:rgba(47,164,222,.25);color:#fff}
#intro .vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(115% 95% at 50% 45%,transparent 52%,rgba(0,0,0,.82) 100%)}
@media (prefers-reduced-motion: reduce){
  #intro{display:none}
}
</style>
</head>
<body>

<div id="intro">
  <div class="wave-scene">
    <svg viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1A3A60"/>
          <stop offset="40%" stop-color="#2A6090"/>
          <stop offset="70%" stop-color="#3A90C0"/>
          <stop offset="100%" stop-color="#50B0D8"/>
        </linearGradient>
        <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0E4A72"/>
          <stop offset="100%" stop-color="#061828"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="82%" cy="18%" r="35%">
          <stop offset="0%" stop-color="#E8A94E" stop-opacity=".9"/>
          <stop offset="40%" stop-color="#D4943A" stop-opacity=".4"/>
          <stop offset="100%" stop-color="#D4943A" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="waveBody" x1="0" y1="0" x2=".3" y2="1">
          <stop offset="0%" stop-color="#1B7AAD"/>
          <stop offset="30%" stop-color="#0D5E8A"/>
          <stop offset="70%" stop-color="#094A6E"/>
          <stop offset="100%" stop-color="#063248"/>
        </linearGradient>
        <linearGradient id="waveFace" x1=".2" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2EA8D6"/>
          <stop offset="50%" stop-color="#1A7EA8"/>
          <stop offset="100%" stop-color="#0C5A7E"/>
        </linearGradient>
        <radialGradient id="barrelGlow" cx="38%" cy="52%" r="30%">
          <stop offset="0%" stop-color="#80E0FF" stop-opacity=".7"/>
          <stop offset="50%" stop-color="#40B0DD" stop-opacity=".3"/>
          <stop offset="100%" stop-color="#1A7AAD" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="foamGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#E8F4FF" stop-opacity=".95"/>
          <stop offset="60%" stop-color="#C0E0F5" stop-opacity=".7"/>
          <stop offset="100%" stop-color="#90C8E8" stop-opacity=".2"/>
        </linearGradient>
        <filter id="wGlow" x="-30%" y="-30%" width="160%" height="160%">

<script>
"use strict";
/* ============================================================
   SAGITTA — v3.0.0 « Teahupoo »
   Carnet de performance & coaching au tir à l'arc
   Fichier unique HTML/JS · persistance localStorage · export JSON/CSV

   Convention de version : X.Y.Z + CodeName
   - X = version majeure — changement demandé/validé avec l'utilisateur avant incrément
   - Y = fonctionnalités ajoutées/modifiées/corrigées/supprimées — incrément peu fréquent ;
         repart à 0 (X+1) quand Y dépasserait 10
   - Z = patchs, modifications marginales, ajouts connexes à l'existant — incrément le plus
         fréquent ; roule vers Y+1 quand Z dépasserait 12
   - CodeName = mémo de période de développement, ne change qu'avec X
   ============================================================ */
const VERSION = "3.0.0";
const CODENAME = "Teahupoo";
const LSKEY = "sagitta.v1";

/* ---------- persistance sûre (dégrade en mémoire si indisponible) ---------- */
let STORAGE_OK = true;
try { const k="__sg_t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); }
catch(e){ STORAGE_OK = false; }
let MEM = null;
function loadState(){
  if(!STORAGE_OK) return MEM;
  try{ const r = localStorage.getItem(LSKEY); return r?JSON.parse(r):null; }catch(e){ return null; }
}
function saveState(){
  if(!STORAGE_OK){ MEM = S; return; }
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){ STORAGE_OK=false; MEM=S; document.getElementById('preview-banner').classList.remove('hidden'); }
}

/* ---------- état ---------- */
const DISCIPLINES = ["Salle 18 m","Extérieur (TAE)","Fédéral","Campagne","3D","Beursault","Entraînement libre"];
const ARCS = ["Arc classique","Arc à poulies","Arc nu (barebow)","Arc droit / longbow"];

/* ============================================================
   BASE D'EXERCICES — sourcée WA Coaching Manual, WA Beginners Manual,
   CDArc77 fiches ludiques, Hattila
   ============================================================ */
const EX_CATS = ["Technique","Précision & groupement","Renforcement physique","Mental & rythme","Jeux & ludique"];
const EXERCICES = [
// --- Technique (phases du cycle de tir) — WA Coach's Manual ch.6 ---
{id:"t01",cat:"Technique",nom:"Position des pieds & stabilité",desc:"Travailler la position ouverte/fermée/neutre et la répartition du poids sur les appuis. Se sentir ancré et stable avant de lever l'arc.",obj:"Stabilité posturale reproductible",src:"WA Coach's Manual 6.1"},
{id:"t02",cat:"Technique",nom:"Pré-positionnement du corps",desc:"Dos plat, épaules basses, poitrine aplatie, centre de gravité bas. Vérifier la verticalité du torse et l'alignement épaules-hanches-pieds.",obj:"Base corporelle identique à chaque flèche",src:"WA Coach's Manual 6.5"},
{id:"t03",cat:"Technique",nom:"Main de corde & prise de corde",desc:"Corde profonde dans les phalanges, dos de main plat et vertical, poignet relâché. 3 doigts répartissent la pression également.",obj:"Décoche propre et régulière",src:"WA Coach's Manual 6.3"},
{id:"t04",cat:"Technique",nom:"Main d'arc & position dans la poignée",desc:"Pression dans le V pouce-index, doigts relâchés, poignet neutre. Pas de serrage — utiliser une dragonne.",obj:"Éliminer le torque sur l'arc",src:"WA Coach's Manual 6.4"},
{id:"t05",cat:"Technique",nom:"Élévation synchronisée",desc:"Monter les deux mains ensemble à hauteur du nez, épaules basses, flèche parallèle au sol. L'épaule d'arc reste la plus basse possible.",obj:"Pré-position haute identique et sans tension",src:"WA Coach's Manual 6.6 / WA Beginners Flèche Blanche"},
{id:"t06",cat:"Technique",nom:"Allonge dans le plan de tir",desc:"Tirer la corde dans le plan vertical de la flèche, main de corde vers le visage (pas le menton vers la corde). Torse immobile.",obj:"Allonge constante et rectiligne",src:"WA Coach's Manual 6.8"},
{id:"t07",cat:"Technique",nom:"Repères faciaux & ancrage",desc:"Trouver et reproduire ses points de contact au visage (menton, lèvres, nez sur la corde). Tester les 3 méthodes : ligne droite, triangle, quadrilatère.",obj:"Ancrage identique à chaque flèche",src:"WA Coach's Manual 6.9 / WA Beginners Flèche Bleue"},
{id:"t08",cat:"Technique",nom:"Expansion à pleine allonge (draw expansion)",desc:"Maintenir une micro-extension continue des omoplates vers la colonne. La pointe de flèche ne recule pas — ou avance imperceptiblement.",obj:"Stabilité et continuité avant la décoche",src:"WA Coach's Manual 6.10"},
{id:"t09",cat:"Technique",nom:"Décoche & suivi (follow-through)",desc:"La main de corde file le long de la mâchoire ou du cou. Le bras d'arc reste en direction de la cible. Aucun signe avant-coureur du tir. Visage impassible.",obj:"Décoche subconsciente, pas de rupture",src:"WA Coach's Manual 6.12/6.14 / WA Beginners Flèche Rouge"},
{id:"t10",cat:"Technique",nom:"Passage de corde (string clearance)",desc:"Vérifier le dégagement de la corde au bras d'arc et à la poitrine. Test du pont de bande adhésive (2 mm surélevé) puis tir d'une flèche.",obj:"Aucun contact parasite de la corde",src:"WA Coach's Manual 6.13 / WA Beginners Flèche Jaune"},
{id:"t11",cat:"Technique",nom:"Alignement corde-avant-bras-flèche",desc:"À pleine allonge, l'avant-bras de corde doit être dans le plan vertical de la flèche. Position qui minimise l'effort et favorise la détente.",obj:"Alignement biomécanique optimal",src:"WA Coach's Manual 6.9 / WA Beginners Flèche Bleue"},
// --- Précision & groupement — Hattila + WA ---
{id:"p01",cat:"Précision & groupement",nom:"Tir sans blason (sur paille)",desc:"Tirer sur un réceptacle nu — paille ou mousse — sans rien à viser. Se concentrer uniquement sur le geste, pas le résultat. L'oeilleton navigue librement.",obj:"Focalisation sur le geste, pas la visée",src:"Hattila — Travailler sans blason"},
{id:"p02",cat:"Précision & groupement",nom:"Tir sur visuel large",desc:"Remplacer le blason par un visuel de grande taille (cercle de 30 cm, post-it…). Pas une contrainte de précision — juste un repère lâche.",obj:"Transition paille → cible sans pression",src:"Hattila — Travailler sans blason"},
{id:"p03",cat:"Précision & groupement",nom:"Tir rapproché progressif",desc:"Commencer à 5-6 m, blason taille standard. Tir compté. Objectif atteint → reculer de quelques mètres. Répéter jusqu'à la distance officielle.",obj:"S'habituer à toucher sa zone, prendre confiance",src:"Hattila — S'habituer à toucher sa zone"},
{id:"p04",cat:"Précision & groupement",nom:"Contrevisée",desc:"Dérégler volontairement le viseur, observer où tombe la flèche, puis contreviser pour la ramener au centre sans toucher au viseur.",obj:"Anticiper la trajectoire, gérer le vent",src:"Hattila — Apprendre à contreviser"},
{id:"p05",cat:"Précision & groupement",nom:"Hit or Miss (touché/raté)",desc:"Volée de 3 flèches — ne pas compter les points, seulement 1 point par flèche dans la zone cible (9-10 par ex.). Se détacher du score brut.",obj:"Se concentrer sur la régularité, pas le score",src:"Hattila — Hit or Miss"},
{id:"p06",cat:"Précision & groupement",nom:"Blason asymétrique (Differential Learning)",desc:"Tirer sur un blason asymétrique ou inhabituel. Compter les points normalement — une autre façon de performer.",obj:"Adaptabilité et concentration visuelle",src:"Hattila — Blasons différents"},
{id:"p07",cat:"Précision & groupement",nom:"Tir yeux fermés (à 3 m)",desc:"À très courte distance, tirer avec les yeux fermés sur un réceptacle nu. Développer les sensations kinesthésiques du geste sans retour visuel.",obj:"Conscience corporelle et reproductibilité du geste",src:"WA Coach's Manual 6.9 / WA Beginners Flèche Bleue"},
// --- Renforcement physique — WA ch.11 + Hattila ---
{id:"r01",cat:"Renforcement physique",nom:"Temps de tenue (holding)",desc:"Tenir à pleine allonge (sous clicker ou non) pendant X secondes avant de décocher. Augmenter progressivement (10s, 15s, 20s…).",obj:"Endurance musculaire à pleine allonge",src:"Hattila — Top chrono / WA Coach's Manual 11.4.6.5"},
{id:"r02",cat:"Renforcement physique",nom:"Volume chronométré (burst)",desc:"X flèches en Y secondes. Enchaîner les flèches rapidement pour augmenter le volume et travailler le physique. Rapprocher la cible.",obj:"Renforcement musculaire spécifique",src:"Hattila — Top chrono / WA Coach's Manual 11.4.6.4"},
{id:"r03",cat:"Renforcement physique",nom:"Tir avec élastique (rubber band)",desc:"Arc monté avec une corde élastique ou bande de résistance. Permet de travailler toutes les phases sans effort excessif, y compris décocher à vide.",obj:"Échauffement orienté et renforcement doux",src:"WA Coach's Manual 11.1.5 / WA Beginners Flèche Noire"},
{id:"r04",cat:"Renforcement physique",nom:"Renforcement avec surcharge",desc:"Ajouter du poids à l'arc (stabilisateur lourd) ou augmenter la puissance des branches pour des séries courtes de renforcement.",obj:"Force spécifique de tir",src:"WA Coach's Manual 11.4.6.1/11.4.6.2"},
{id:"r05",cat:"Renforcement physique",nom:"Échauffement complet",desc:"Cardio léger (5 min), mouvements articulaires (épaules, coudes, poignets, cou), étirements, puis tir de chauffe sur paille.",obj:"Prévention des blessures, montée en température",src:"WA Coach's Manual 11.1 / Hattila — Échauffement"},
// --- Mental & rythme — Hattila + WA ---
{id:"m01",cat:"Mental & rythme",nom:"Découpage de la stratégie de tir",desc:"Écrire sur un carnet toutes les étapes de sa séquence de tir. Les transformer en mots-clés personnels (ex. « placement », « en ligne », « lâcher »).",obj:"Conscience et reproductibilité du processus de tir",src:"Hattila — Découper votre tir"},
{id:"m02",cat:"Mental & rythme",nom:"Travail au miroir",desc:"Tirer à 5-10 m face à un miroir posé de biais. Observer en temps réel les contacts au visage, le placement des épaules, la décoche.",obj:"Correction visuelle en direct du geste",src:"Hattila — Le miroir / WA Beginners Flèche Noire"},
{id:"m03",cat:"Mental & rythme",nom:"Auto-vidéo",desc:"Se filmer au smartphone pendant un tir. Analyser au ralenti : rythme, position, décoche, suivi. Comparer entre séances.",obj:"Feedback objectif et suivi de progression",src:"Hattila — La vidéo"},
{id:"m04",cat:"Mental & rythme",nom:"Rythme au chrono (métronome)",desc:"Mesurer et stabiliser le temps par flèche et le temps de récupération entre flèches. Viser la régularité du rythme, pas la vitesse.",obj:"Devenir un métronome imperturbable",src:"Hattila — Rythmer son tir"},
{id:"m05",cat:"Mental & rythme",nom:"Séquence de tir complète (routine)",desc:"Répéter fidèlement toutes les étapes du tir dans l'ordre, avec un temps constant (+/- 10 s). Le tir doit prendre l'observateur par surprise.",obj:"Automatisation de la routine de tir",src:"WA Beginners Flèche Jaune / WA Coach's Manual 6.14"},
// --- Jeux & ludique — CDArc77 + WA ch.12 ---
{id:"j01",cat:"Jeux & ludique",nom:"Morpion à l'arc",desc:"Grille 3×3 sur la cible. Deux archers s'affrontent : chaque flèche dans une case = prise de la case. Premier alignement de 3 gagne.",obj:"Précision ciblée + aspect ludique",src:"CDArc77 — Échauffement Morpion"},
{id:"j02",cat:"Jeux & ludique",nom:"Jeu du Géomètre",desc:"Former des figures géométriques sur la cible avec ses flèches (triangle, carré, ligne…). Points bonus si la figure est régulière.",obj:"Contrôle du placement des flèches",src:"CDArc77 — Jeu du Géomètre"},
{id:"j03",cat:"Jeux & ludique",nom:"Jeu du Hérisson",desc:"Planter un maximum de flèches dans la plus petite zone possible. Plus c'est groupé, plus le hérisson est réussi.",obj:"Groupement maximal",src:"CDArc77 — Jeu du Hérisson"},
{id:"j04",cat:"Jeux & ludique",nom:"Jeu du Poker",desc:"Chaque zone de la cible correspond à une carte. Constituer la meilleure main de poker avec ses flèches.",obj:"Stratégie de placement + fun",src:"CDArc77 — Jeu du Poker"},
{id:"j05",cat:"Jeux & ludique",nom:"Mario Kart",desc:"Parcours de tir avec des « items » (zones spéciales sur la cible). Toucher un item active un bonus ou un malus pour l'adversaire.",obj:"Compétition ludique entre archers",src:"CDArc77 — Jeu du Mario Kart"},
{id:"j06",cat:"Jeux & ludique",nom:"T'éclates tu perds",desc:"Des ballons sont fixés sur la cible. Chaque ballon éclaté = pénalité. Il faut placer ses flèches sans toucher les ballons.",obj:"Précision d'évitement",src:"CDArc77 — T'éclates tu perds"},
{id:"j07",cat:"Jeux & ludique",nom:"Jeu de Cupidon",desc:"Cibles en forme de cœur à différentes distances. Toucher le cœur = point. Exercice festif pour les jeunes.",obj:"Précision ludique",src:"CDArc77 — Jeu de Cupidon"},
{id:"j08",cat:"Jeux & ludique",nom:"300 (WA Game)",desc:"Objectif : totaliser 300 points en un minimum de flèches. Chaque flèche compte. Si une flèche rate, elle pénalise le total.",obj:"Pression de performance ludique",src:"WA Coach's Manual ch.12 — 300"},
{id:"j09",cat:"Jeux & ludique",nom:"Robin Hood",desc:"Tenter de planter sa flèche le plus près possible d'une flèche déjà en cible. Proximité maximale = victoire.",obj:"Groupement extrême et contrôle",src:"WA Coach's Manual ch.12 — Robin Hood"},
{id:"j10",cat:"Jeux & ludique",nom:"Spider in the Net",desc:"Grille dessinée sur la cible. Toucher les intersections. Chaque intersection touchée = point, chaque fil touché = pénalité.",obj:"Précision fine et concentration",src:"WA Coach's Manual ch.12 — Spider in the Net"},
];

function defaultState(){
  return {
    version:VERSION,
    profile:{ nom:"Archer", arc:"Arc classique", main:"Droitier" },
    objectif:{ moyenneCible:null, note:"" },
    seances:[],
    materiel:{ arcs:[], fleches:[], viseurs:[] },
    ui:{ view:"seances", activeSeanceId:null, analyseId:null, materielTab:"arcs", viseurDetailId:null, seanceTab:"resume" }
  };
}
let S = loadState() || defaultState();
if(!S.ui) S.ui = {view:"seances",activeSeanceId:null,analyseId:null};
if(!S.ui.materielTab) S.ui.materielTab="arcs";
if(!S.ui.seanceTab) S.ui.seanceTab="resume";
if(!S.materiel) S.materiel={arcs:[],fleches:[],viseurs:[]};
// migration : ajouter exercices[] aux séances existantes
S.seances.forEach(se=>{ if(!se.exercices) se.exercices=[]; });
if(!STORAGE_OK) document.getElementById('preview-banner').classList.remove('hidden');

/* ---------- utilitaires ---------- */
const $ = s=>document.querySelector(s);
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmtDate(iso){ const d=new Date(iso); return d.getDate()+" "+MOIS[d.getMonth()]+" "+d.getFullYear(); }
function dayOf(iso){ const d=new Date(iso); return {d:d.getDate(), m:MOIS[d.getMonth()].replace('.','')}; }
function round(n,p=1){ if(n==null||isNaN(n)) return "—"; const f=Math.pow(10,p); return Math.round(n*f)/f; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function arcLabel(se){
  if(se.arcId){ const a=S.materiel.arcs.find(x=>x.id===se.arcId); if(a) return `${a.nom} (${a.type})`; }
  return se.arcType||"";
}
function flecheLabel(se){
  if(se.flecheId){ const fl=S.materiel.fleches.find(x=>x.id===se.flecheId); if(fl) return fl.nom; }
  return "";
}

/* ---------- moteur de scoring / géométrie du blason ---------- */
/* ---------- catalogue de blasons ---------- */
const BLASONS = [
  {id:"a122",type:"Anglais",nom:"Blason anglais",taille:122,scoring:"10z",label:"Anglais 122 cm · 10 zones"},
  {id:"a80",type:"Anglais",nom:"Blason anglais",taille:80,scoring:"10z",label:"Anglais 80 cm · 10 zones"},
  {id:"a60",type:"Anglais",nom:"Blason anglais",taille:60,scoring:"10z",label:"Anglais 60 cm · 10 zones"},
  {id:"a40",type:"Anglais",nom:"Blason anglais",taille:40,scoring:"10z",label:"Anglais 40 cm · 10 zones"},
  {id:"a60p",type:"Anglais",nom:"Blason anglais",taille:60,scoring:"5z",label:"Anglais 60 cm · 5 zones (poulies)"},
  {id:"a80p",type:"Anglais",nom:"Blason anglais",taille:80,scoring:"5z",label:"Anglais 80 cm · 5 zones (poulies)"},
  {id:"t60",type:"Anglais",nom:"Trispot",taille:60,scoring:"5z",label:"Trispot 60 cm · 5 zones"},
  {id:"t40",type:"Anglais",nom:"Trispot",taille:40,scoring:"5z",label:"Trispot 40 cm · 5 zones"},
  {id:"f80",type:"Field",nom:"Blason campagne",taille:80,scoring:"field6",label:"Campagne 80 cm · 6 zones"},
  {id:"f60",type:"Field",nom:"Blason campagne",taille:60,scoring:"field6",label:"Campagne 60 cm · 6 zones"},
  {id:"f40",type:"Field",nom:"Blason campagne",taille:40,scoring:"field6",label:"Campagne 40 cm · 6 zones"},
  {id:"f20",type:"Field",nom:"Blason campagne",taille:20,scoring:"field6",label:"Campagne 20 cm · 6 zones"},
  {id:"beur",type:"Beursault",nom:"Beursault",taille:48,scoring:"beur3",label:"Beursault 48 cm · 3 zones"},
  {id:"anim",type:"Animalier",nom:"Animal",taille:0,scoring:"animal",label:"Animal (zones marquées)"},
  {id:"3d",type:"3D",nom:"Cible 3D",taille:0,scoring:"3d",label:"Cible 3D"},
  {id:"postit",type:"Entraînement",nom:"Post-it",taille:8,scoring:"postit",label:"Post-it (sans blason)"},
];

// scoring: "10z" (10..1), "5z" (10..6), "field6" (6..1), "beur3" (3..1), "animal", "3d", "postit"
function faceModel(blasonCm, scoring){
  const R = blasonCm/2;
  let zones;
  if(scoring==="5z") zones=5;
  else if(scoring==="field6") zones=6;
  else if(scoring==="beur3") zones=3;
  else zones=10; // 10z default
  return { R, zones, ringW:R/zones, xRadius:R/(zones*2) };
}
function scoreFromRadius(rCm, blasonCm, scoring){
  if(scoring==="animal"||scoring==="3d"||scoring==="postit") return {v:0,isX:false}; // pas de scoring géométrique
  const f = faceModel(blasonCm,scoring);
  if(rCm>f.R) return {v:0,isX:false};
  let k = Math.floor(rCm/f.ringW);
  if(k>=f.zones) k=f.zones-1;
  let v;
  if(scoring==="5z") v = 10-k;          // 10,9,8,7,6 (5 zones)
  else if(scoring==="field6") v = 6-k;  // 6,5,4,3,2,1
  else if(scoring==="beur3") v = 3-k;   // 3,2,1
  else v = 10-k;                         // 10..1 (10 zones)
  const isX = rCm<=f.xRadius;
  return {v, isX};
}
function maxScoreForScoring(scoring){
  if(scoring==="5z") return 10;
  if(scoring==="field6") return 6;
  if(scoring==="beur3") return 3;
  if(scoring==="animal"||scoring==="3d"||scoring==="postit") return 0;
  return 10;
}
function minScoreForScoring(scoring){
  if(scoring==="5z") return 6;
  if(scoring==="field6") return 1;
  if(scoring==="beur3") return 1;
  return 1;
}
function blasonLabel(se){
  const b=BLASONS.find(x=>x.id===se.blasonId);
  const base = b ? b.label : `Ø${se.blasonCm||'?'} cm`;
  if(hasMultiBlason(se)){
    const others = [...new Set(se.volees.filter(v=>v.blasonId && v.blasonId!==se.blasonId).map(v=>{const bb=BLASONS.find(x=>x.id===v.blasonId);return bb?bb.nom:v.blasonId;}))];
    return base + (others.length ? ' + ' + others.join(', ') : '');
  }
  return base;
}
function isManualScoringOnly(scoring){ return scoring==="animal"||scoring==="3d"||scoring==="postit"; }
// couleur World Archery d'une zone (score v)
function zoneColor(v){
  if(v>=9) return "var(--wa-gold)";
  if(v>=7) return "var(--wa-red)";
  if(v>=5) return "var(--wa-blue)";
  if(v>=3) return "var(--wa-black)";
  if(v>=1) return "var(--wa-white)";
  return "#4a5a55";
}
function zoneHex(v){
  if(v>=9) return "#F6D33C"; if(v>=7) return "#E23B2E"; if(v>=5) return "#2FA4DE";
  if(v>=3) return "#161616"; if(v>=1) return "#EFEBDD"; return "#4a5a55";
}

/* ---------- helpers blason par volée ---------- */
// Chaque volée peut stocker son propre blason ; sinon on hérite de la séance (rétrocompat)
function voleeScoring(v, se){ return v.scoring || se.scoring; }
function voleeBlasonCm(v, se){ return v.blasonCm || se.blasonCm; }
function voleeBlasonId(v, se){ return v.blasonId || se.blasonId; }
function hasMultiBlason(se){ return se.volees.some(v=>v.scoring && v.scoring!==se.scoring); }
function allPostit(se){ return se.scoring==='postit' && !se.volees.some(v=>v.scoring && v.scoring!=='postit'); }
function hasAnyPostit(se){ return se.scoring==='postit' || se.volees.some(v=>v.scoring==='postit'); }
function hasAnyScoredVolee(se){ return se.volees.some(v=>voleeScoring(v,se)!=='postit'); }
// Stats séparées : scored (non-postit) et postit
function splitStats(se){
  const scored={n:0,total:0}, postit={n:0,total:0};
  se.volees.forEach(v=>{
    const sc=voleeScoring(v,se);
    v.fleches.forEach(f=>{
      if(sc==='postit'){ postit.n++; postit.total+=(f.v||0); }
      else { scored.n++; scored.total+=(f.v||0); }
    });
  });
  scored.avg = scored.n ? scored.total/scored.n : 0;
  postit.rate = postit.n ? round(postit.total/postit.n*100,0) : 0;
  return {scored, postit};
}

/* ---------- statistiques d'une séance ---------- */
function flatArrows(se){ const a=[]; se.volees.forEach(v=>{const sc=voleeScoring(v,se),cm=voleeBlasonCm(v,se); v.fleches.forEach(f=>{f._scoring=sc;f._blasonCm=cm;a.push(f)});}); return a; }
function endTotals(se){ return se.volees.map(v=>v.fleches.reduce((s,f)=>s+(f.v||0),0)); }
function seanceStats(se){
  const arrows = flatArrows(se);
  const n = arrows.length;
  const total = arrows.reduce((s,f)=>s+(f.v||0),0);
  const avg = n? total/n : 0;
  const tens = arrows.filter(f=>f.v===10).length;
  const xs = arrows.filter(f=>f.isX).length;
  const nines = arrows.filter(f=>f.v>=9).length;
  const miss = arrows.filter(f=>f.v===0).length;
  const ets = endTotals(se);
  // répartition par zone
  const dist = {}; for(let v=0;v<=10;v++) dist[v]=0;
  arrows.forEach(f=>dist[f.v]=(dist[f.v]||0)+1);
  // --- dispersion (nécessite coordonnées) ---
  const plotted = arrows.filter(f=>f.x!=null && f.y!=null);
  let disp=null;
  if(plotted.length>=3){
    const mx = plotted.reduce((s,f)=>s+f.x,0)/plotted.length;
    const my = plotted.reduce((s,f)=>s+f.y,0)/plotted.length;
    const sdx = Math.sqrt(plotted.reduce((s,f)=>s+(f.x-mx)**2,0)/plotted.length);
    const sdy = Math.sqrt(plotted.reduce((s,f)=>s+(f.y-my)**2,0)/plotted.length);
    // rayon moyen autour du centre de groupe (précision pure)
    const rmean = plotted.reduce((s,f)=>s+Math.hypot(f.x-mx,f.y-my),0)/plotted.length;
    const sdr = Math.sqrt(sdx*sdx+sdy*sdy); // rayon du cercle de dispersion (~68%)
    // hull = étalement extrême (max distance entre 2 impacts)
    let spread=0;
    for(let i=0;i<plotted.length;i++)for(let j=i+1;j<plotted.length;j++){const dd=Math.hypot(plotted[i].x-plotted[j].x,plotted[i].y-plotted[j].y);if(dd>spread)spread=dd;}
    const dCenter = Math.hypot(mx,my); // distance PIM->centre (justesse)
    // score potentiel : groupe recentré (PIM au centre), même dispersion
    let potential=0;
    plotted.forEach(f=>{ const r=Math.hypot(f.x-mx,f.y-my); potential += scoreFromRadius(r,f._blasonCm||se.blasonCm,f._scoring||se.scoring).v; });
    const actualPlotted = plotted.reduce((s,f)=>s+f.v,0);
    // --- déviation angulaire (mrad) et rating estimé, façon système de handicap (UK Archery / David Lane) ---
    // Principe : l'écart-type du groupement, normalisé par la distance de tir, donne une mesure
    // comparable d'une séance à l'autre même si la distance change (18 m salle vs 70 m extérieur).
    let angMrad=null, ratingH=null;
    if(se.distance>0){
      const angRad = (sdr/100) / se.distance; // approximation petit angle
      angMrad = angRad*1000;
      const angDeg = angRad*180/Math.PI;
      if(angDeg>0) ratingH = Math.log(angDeg/0.045)/Math.log(1.036); // ancrage: handicap 0 ≈ 0.045°
    }
    disp = { n:plotted.length, mx,my,sdx,sdy,rmean,sdr,spread,dCenter, potential, actualPlotted,
             gain: potential-actualPlotted, angMrad, ratingH };
  }
  return { n,total,avg,tens,xs,nines,miss, dist, ets, disp,
           tenRate:n?tens/n*100:0, xRate:n?xs/n*100:0, goldRate:n?nines/n*100:0 };
}

/* ---------- diagnostic / synthèse coaching ---------- */
function diagnose(se){
  const st = seanceStats(se);
  const forces=[], faibles=[], axes=[];
  // Pour multi-blason, on utilise le blason dominant (non-postit) pour les métriques de dispersion
  const domScoring = se.scoring==='postit' && hasAnyScoredVolee(se) ?
    (se.volees.find(v=>v.scoring && v.scoring!=='postit')||{}).scoring || se.scoring : se.scoring;
  const domCm = se.scoring==='postit' && hasAnyScoredVolee(se) ?
    (se.volees.find(v=>v.scoring && v.scoring!=='postit')||{}).blasonCm || se.blasonCm : se.blasonCm;
  const f = faceModel(domCm, domScoring);

  // dispersion / groupement / centrage (si tracé)
  if(st.disp){
    const d = st.disp;
    const groupRel = d.rmean / f.ringW; // rayon moyen exprimé en "largeur de zone"
    if(groupRel < 0.9) forces.push(["Groupement serré", `Rayon moyen de <b>${round(d.rmean)} cm</b> autour du centre de groupe (≈ ${round(groupRel,1)} largeur de zone). Belle précision.`]);
    else if(groupRel > 1.6) faibles.push(["Groupement large", `Rayon moyen de <b>${round(d.rmean)} cm</b>. La dispersion coûte des points indépendamment de la visée : priorité au travail de constance du geste.`]);

    if(d.angMrad!=null){
      axes.push(["Groupement normalisé par la distance", `Ton groupement correspond à une déviation angulaire d'environ <b>${round(d.angMrad,1)} mrad</b> (rating estimé ≈ <b>${round(d.ratingH,0)}</b>, méthode de handicap type UK Archery — 0 = quasi parfait ≈0,8 mrad, 100 = niveau débutant ≈27 mrad). Cette valeur est comparable d'une distance à l'autre, contrairement au score brut.`]);
    }

    // centrage
    const off = d.dCenter;
    const dirH = d.mx>0?"à droite":"à gauche";
    const dirV = d.my>0?"vers le haut":"vers le bas";
    if(off > f.ringW*0.55){
      const parts=[];
      if(Math.abs(d.mx)>f.ringW*0.35) parts.push(`décalé ${dirH} de ${round(Math.abs(d.mx))} cm`);
      if(Math.abs(d.my)>f.ringW*0.35) parts.push(`${dirV} de ${round(Math.abs(d.my))} cm`);
      faibles.push(["Centrage : biais systématique", `Ton point d'impact moyen est ${parts.join(", ")}. Un décalage horizontal oriente vers un réglage de dérive/alignement ; un décalage vertical vers la hausse du viseur, l'ancrage ou le timing de décoche.`]);
      if(d.gain>0) axes.push(["Score potentiel disponible", `À dispersion identique, un groupe parfaitement centré te ferait gagner <b>+${d.gain} pts</b> sur cette séance. Le gain principal est ici dans le RÉGLAGE/la VISÉE, pas dans le geste.`]);
    } else {
      forces.push(["Centrage propre", `Point d'impact moyen à <b>${round(off)} cm</b> du centre : ta visée/ton réglage sont justes. Le potentiel de progrès est surtout dans le resserrement du groupe.`]);
    }
  } else {
    axes.push(["Active l'analyse de dispersion", `Sur tes prochaines volées, place les impacts sur la cible (onglet Saisie, mode « Pointer »). Sagitta calculera alors groupement, centrage (PIM), score potentiel et déviation angulaire (mrad) — les indicateurs qu'utilisent les systèmes de classement des archers.`]);
  }

  // fatigue / tendance intra-séance
  if(st.ets.length>=6){
    const third = Math.max(1,Math.floor(st.ets.length/3));
    const first = st.ets.slice(0,third), last = st.ets.slice(-third);
    const avgF = first.reduce((a,b)=>a+b,0)/first.length;
    const avgL = last.reduce((a,b)=>a+b,0)/last.length;
    const dropPct = avgF? (avgL-avgF)/avgF*100 : 0;
    if(dropPct < -6) faibles.push(["Baisse en fin de séance", `Tes dernières volées perdent <b>${round(Math.abs(dropPct))} %</b> vs le début. Piste : endurance de tir / concentration. Fractionne, ou réduis le volume utile en gardant la qualité.`]);
    else if(dropPct > 6) axes.push(["Effet d'échauffement", `Tu montes en puissance (+${round(dropPct)} % en fin de séance). Un échauffement à blanc plus long pourrait rendre tes premières volées aussi productives.`]);
    else forces.push(["Séance homogène", `Aucune dérive marquée entre début et fin : bonne gestion de l'effort et de la concentration.`]);
  }

  // taux de 10
  if(st.tenRate>=40) forces.push(["Fort taux de 10", `<b>${round(st.tenRate)} %</b> de tes flèches sont des 10 (dont ${st.xs} X). Tu convertis quand tu es bien placé.`]);
  if(st.miss>0) faibles.push(["Flèches hors cible", `${st.miss} flèche(s) hors blason. À isoler : geste ponctuel, décoche accrochée, ou perte de concentration — elles pèsent lourd sur la moyenne.`]);

  return {st, forces, faibles, axes};
}

function setView(v){
  S.ui.view=v; saveState();
  ["seances","saisie","analyse","progression","coaching","materiel"].forEach(k=>{
    $("#view-"+k).classList.toggle("hidden",k!==v);
  });
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.nav===v));
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function render(){
  const v=S.ui.view;
  if(v==="seances") renderSeances();
  else if(v==="saisie") renderSaisie();
  else if(v==="analyse") renderAnalyse();
  else if(v==="progression") renderProgression();
  else if(v==="coaching") renderCoaching();
  else if(v==="materiel") renderMateriel();
}

/* ---------- VUE SÉANCES ---------- */
function renderSeances(){
  const el=$("#view-seances");
  const seances=[...S.seances].sort((a,b)=>new Date(b.date)-new Date(a.date));
  let list;
  if(!seances.length){
    list=`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      <h3>Aucune séance pour l'instant</h3>
      <p>Crée ta première séance pour commencer à mesurer ta performance — ou charge une séance de démonstration pour voir les indicateurs en action.</p>
      <div class="btnrow" style="justify-content:center;margin-top:16px">
        <button class="btn primary" onclick="newSeance()">Nouvelle séance</button>
        <button class="btn ghost" onclick="loadDemo()">Séance de démonstration</button>
      </div>
    </div>`;
  } else {
    list=`<div class="slist">`+seances.map(se=>{
      const st=seanceStats(se); const dd=dayOf(se.date);
      const done=flatArrows(se).length;
      return `<button class="scard" onclick="openAnalyse('${se.id}')">
        <div class="day"><div class="d">${dd.d}</div><div class="m">${dd.m}</div></div>
        <div class="meta">
          <div class="t">${esc(se.discipline)}${se.distance?` · ${se.distance} m`:""}</div>
          <div class="s">${esc(arcLabel(se))}${flecheLabel(se)?` · ${esc(flecheLabel(se))}`:''} · ${blasonLabel(se)} · ${done} flèches ${st.disp?"· 🎯 tracé":""}${(se.exercices||[]).length?` · 🏋 ${se.exercices.length} exo`:""}</div>
        </div>
        <div class="sc"><div class="big">${allPostit(se)?`${st.total}/${st.n}`:st.total}</div><div class="avg">${allPostit(se)?`${st.n?round(st.total/st.n*100,0):0}%`:`${round(st.avg,2)}/flèche`}</div></div>
      </button>`;
    }).join("")+`</div>`;
  }
  el.innerHTML=`
    <div class="section-head">
      <div><div class="eyebrow">Carnet</div><h2>Mes séances</h2></div>
      <div class="btnrow">
        ${seances.length?'<button class="btn ghost sm" onclick="loadDemo()">+ Démo</button>':''}
        <button class="btn primary" onclick="newSeance()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nouvelle séance</button>
      </div>
    </div>
    ${seances.length?renderSummaryStrip():""}
    ${list}`;
}
function renderSummaryStrip(){
  const all=S.seances; if(!all.length) return "";
  const totArrows=all.reduce((s,se)=>s+flatArrows(se).length,0);
  const avgs=all.map(se=>seanceStats(se).avg).filter(x=>x>0);
  const bestAvg=avgs.length?Math.max(...avgs):0;
  const globalAvg=avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:0;
  return `<div class="metrics" style="margin-bottom:18px">
    <div class="metric"><div class="lab">Séances</div><div class="val">${all.length}</div></div>
    <div class="metric"><div class="lab">Flèches tirées</div><div class="val">${totArrows}</div></div>
    <div class="metric"><div class="lab">Moyenne globale</div><div class="val">${round(globalAvg,2)}<small>/fl</small></div></div>
    <div class="metric accent"><div class="lab">Meilleure moyenne</div><div class="val">${round(bestAvg,2)}<small>/fl</small></div></div>
  </div>`;
}

    <div class="btnrow" style="margin-top:18px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Annuler</button>

    </div>`);
}
function createSeance(){
  const disc=$("#ns-disc").value;
  const arcVal=$("#ns-arc").value;
  const savedArc = S.materiel.arcs.find(a=>a.id===arcVal);
  const flecheEl=$("#ns-fleche");
  const flecheId = flecheEl && flecheEl.value ? flecheEl.value : null;
  const blasonSel=$("#ns-blason").value;
  const blason=BLASONS.find(b=>b.id===blasonSel)||BLASONS[3]; // fallback a40
  const se={
    id:uid(),
    date:$("#ns-date").value||new Date().toISOString().slice(0,10),
    discipline:disc,
    distance:parseInt($("#ns-dist").value)||0,
    arcId: savedArc? savedArc.id : null,
    arcType: savedArc? savedArc.type : arcVal,
    flecheId,
    blasonId:blason.id,
    blasonCm:blason.taille||40,
    scoring:blason.scoring,
    flechesParVolee:Math.max(1,parseInt($("#ns-fpv").value)||6),
    nbVolees:Math.max(1,parseInt($("#ns-nv").value)||10),
    note:$("#ns-note").value.trim(),
    clickerTime: $("#ns-clicker").value ? parseFloat($("#ns-clicker").value) : null,
    volees:[], exercices:[]
  };
  S.profile._lastDisc=disc; S.profile.arc=se.arcType; S.profile._lastBlasonId=blason.id;
  if(savedArc) S.profile._lastArcId=savedArc.id; if(flecheId) S.profile._lastFlecheId=flecheId;
  S.seances.push(se); S.ui.activeSeanceId=se.id; S.ui.inputMode="pointer"; resetZoomState();
  CUR_BLASON=null; // reset — défaut = blason de la séance
  saveState(); closeModal(); setView("saisie");
}

/* ---------- VUE SAISIE ---------- */
let CURRENT_END=[]; // flèches de la volée en cours
// Blason actif pour la volée en cours (peut différer de se.scoring)
let CUR_BLASON = null; // {id, cm, scoring} — null = utiliser le défaut de la séance
function curBlason(se){ return CUR_BLASON || { id:se.blasonId, cm:se.blasonCm, scoring:se.scoring }; }
function setCurBlason(blasonId){
  const b = BLASONS.find(x=>x.id===blasonId);
  if(!b) return;
  CUR_BLASON = { id:b.id, cm:b.taille||40, scoring:b.scoring };
  // Reset current end if scoring type changed (arrows incompatible)
  if(CURRENT_END.length) { CURRENT_END=[]; toast("Volée en cours vidée (changement de cible)"); }
  S.ui._lastVoleeBlason = blasonId;
  saveState(); renderSaisie();
}
function renderSaisie(){
  const el=$("#view-saisie");
  const se=S.seances.find(x=>x.id===S.ui.activeSeanceId);
  if(!se){
    el.innerHTML=`<div class="empty"><h3>Aucune séance active</h3><p>Crée ou ouvre une séance pour saisir tes volées.</p><button class="btn primary" style="margin-top:12px" onclick="newSeance()">Nouvelle séance</button></div>`;
    return;
  }
  if(!se.exercices) se.exercices=[];
  const tab=S.ui.seanceTab||"resume";
  const st=seanceStats(se);
  el.innerHTML=`
    <div class="section-head">
      <div><div class="eyebrow">${esc(se.discipline)}${se.distance?` · ${se.distance} m`:""}</div><h2>Séance du ${fmtDate(se.date)}</h2></div>
      <button class="btn ghost sm" onclick="openAnalyse('${se.id}')">Analyse →</button>
    </div>
    <div class="pills" style="margin-bottom:16px">
      <button class="pill ${tab==='resume'?'on':''}" onclick="setSeanceTab('resume')">📋 Résumé</button>
      <button class="pill ${tab==='tirs'?'on':''}" onclick="setSeanceTab('tirs')">🎯 Tirs comptés</button>
      <button class="pill ${tab==='exercices'?'on':''}" onclick="setSeanceTab('exercices')">🏋 Exercices</button>
      <button class="pill ${tab==='bilan'?'on':''}" onclick="setSeanceTab('bilan')">📊 Bilan</button>
    </div>
    <div id="seance-tab-content"></div>
  `;
  const container=document.getElementById('seance-tab-content');
  if(tab==='resume') container.innerHTML=renderSeanceResume(se,st);
  else if(tab==='tirs') { container.innerHTML=renderSeanceTirs(se,st); attachTargetHandlers(se); setupZoomPan(); }
  else if(tab==='exercices') container.innerHTML=renderSeanceExercices(se);
  else if(tab==='bilan') container.innerHTML=renderSeanceBilan(se,st);
}
function setSeanceTab(t){ S.ui.seanceTab=t; saveState(); renderSaisie(); }

/* --- Onglet 1 : Résumé --- */

}

/* --- Onglet 2 : Tirs comptés (la saisie existante) --- */
function renderSeanceTirs(se,st){
  if(S.ui.inputMode==null) S.ui.inputMode="pointer";

  const mode = manual ? 'pad' : S.ui.inputMode;
  const fpv=se.flechesParVolee, done=se.volees.length;
  // Construire un "fake se" avec le blason actif pour targetSVG/padHTML
  const seFake = Object.assign({}, se, { blasonCm:cb.cm, scoring:curScoring, blasonId:cb.id });
  // Sélecteur de blason compact
  const blasonOpts = BLASONS.map(b=>`<option value="${b.id}" ${b.id===cb.id?'selected':''}>${esc(b.label)}</option>`).join("");
  const blasonSel = `<select class="blason-inline-sel" onchange="setCurBlason(this.value)" style="font-size:12px;padding:4px 8px;border-radius:6px;background:var(--card);color:var(--ink);border:1px solid var(--border)">${blasonOpts}</select>`;

    <div class="panel" style="padding:14px;margin-bottom:14px">

          ${curScoring==='postit'?`<span class="hint" style="margin:0">🟦 Post-it</span>`:
          manual?`<span class="hint" style="margin:0">🎯 ${esc(curBlasonLabel)}</span>`:
          `<div class="pills">
            <button class="pill ${mode==='pointer'?'on':''}" onclick="setMode('pointer')">🎯 Pointer</button>
            <button class="pill ${mode==='pad'?'on':''}" onclick="setMode('pad')">⌨︎ Pad</button>
          </div>`}
          <div style="font-size:12px;color:var(--muted)">Cible : ${blasonSel}</div>
        </div>
        <div class="mono" style="color:var(--muted);font-size:13px">${
          `Total : <b style="color:var(--gold)">${st.total}</b> · ${round(st.avg,2)}/fl · volée ${done+1}/${se.nbVolees}`}</div>
      </div>
    </div>
    <div class="saisie-layout">
      <div class="panel">
        ${mode==='pointer'?targetSVG(seFake):padHTML(seFake)}

          <div class="eyebrow" style="margin-bottom:8px">Volée en cours — ${CURRENT_END.length}/${fpv}</div>
          <div class="endstrip" id="endstrip">${endStripHTML(fpv)}</div>
          <div class="btnrow" style="margin-top:14px">
            <button class="btn sm" onclick="undoArrow()" ${!CURRENT_END.length?'disabled style="opacity:.4"':''}>↶ Annuler flèche</button>
            <button class="btn primary sm" onclick="validateEnd()" ${CURRENT_END.length!==fpv?'disabled style="opacity:.45"':''}>Valider la volée</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="eyebrow" style="margin-bottom:10px">Volées enregistrées</div>
        ${done? se.volees.map((v,i)=>voleeRowHTML(v,i,voleeScoring(v,se),se)).join("") : '<div class="hint">Aucune volée validée.</div>'}
        ${done?`<div class="divider"></div>
          <div style="display:flex;justify-content:space-between" class="mono">
            <span style="color:var(--muted)">Moyenne / volée</span><b>${round(st.total/(se.volees.length||1),1)}</b></div>
          <div style="display:flex;justify-content:space-between;margin-top:4px" class="mono">
            <span style="color:var(--muted)">Taux de X</span><b>${round(st.xRate)} %</b></div>`:''}
      </div>
    </div>
    <div class="subnote">Tu peux changer de cible entre les volées grâce au sélecteur ci-dessus.</div>`;
}

/* --- Onglet 3 : Exercices --- */

}
function filterExCatalog(){ const cat=document.getElementById('ex-cat').value; document.getElementById('ex-catalog').innerHTML=exCatalogHTML(cat); }
function exCatalogHTML(cat){
  const list=cat?EXERCICES.filter(e=>e.cat===cat):EXERCICES;

function startExercice(exId){
  const ref=EXERCICES.find(e=>e.id===exId);
  if(!ref) return;
  modal(`
    <h3>🏋 ${esc(ref.nom)}</h3>
    <div class="hint" style="margin-bottom:8px"><span class="tag">${esc(ref.cat)}</span> · ${esc(ref.src)}</div>

}
function logExercice(exId){
  const se=S.seances.find(x=>x.id===S.ui.activeSeanceId); if(!se) return;
  if(!se.exercices) se.exercices=[];
  se.exercices.push({
    exerciceId:exId,
    date:new Date().toISOString(),
    notes:(document.getElementById('ex-notes').value||'').trim(),
    duree:document.getElementById('ex-duree').value?parseInt(document.getElementById('ex-duree').value):null,
    resultat:(document.getElementById('ex-resultat').value||'').trim()
  });
  saveState(); closeModal(); toast("Exercice enregistré"); renderSaisie();
}
function removeExercice(seId,idx){
  const se=S.seances.find(x=>x.id===seId); if(!se) return;
  se.exercices.splice(idx,1); saveState(); renderSaisie();
}

/* --- Onglet 4 : Bilan --- */

        }

}
function setMode(m){ S.ui.inputMode=m; saveState(); renderSaisie(); }
function arrowLbl(f,scoring){
  if(f.isX) return "X";
  if(f.v===0) return "M";
  if(scoring==="postit") return "✓";
  return f.v;
}
function arrowColor(f,scoring){
  if(scoring==="postit"&&f.v>0) return "#2dcc70";
  return zoneColor(f.v);
}
function endStripHTML(fpv){
  const se=S.seances.find(x=>x.id===S.ui.activeSeanceId);
  const scoring=se?curBlason(se).scoring:'';
  let h="";
  for(let i=0;i<fpv;i++){
    const f=CURRENT_END[i];
    if(f){ const lbl=arrowLbl(f,scoring); const c=arrowColor(f,scoring);
      h+=`<span class="arrowchip filled" style="color:${c};border-color:${c}">${lbl}</span>`;
    } else h+=`<span class="arrowchip">·</span>`;
  }
  return h;
}
function voleeRowHTML(v,i,scoring,se){
  const tot=v.fleches.reduce((s,f)=>s+(f.v||0),0);
  const chips=v.fleches.map(f=>{const l=arrowLbl(f,scoring); const c=arrowColor(f,scoring); return `<span class="mini-arrow" style="color:${c}">${l}</span>`;}).join("");
  const totLabel=scoring==='postit'?`${tot}/${v.fleches.length}`:tot;
  // Badge blason si différent du défaut de la séance
  const badge = (se && v.blasonId && v.blasonId!==se.blasonId) ?
    `<span style="font-size:10px;color:var(--muted);margin-left:4px" title="${esc((BLASONS.find(b=>b.id===v.blasonId)||{}).label||'')}">${scoring==='postit'?'🟦':'🎯'}</span>` : '';
  return `<div class="volee-row"><span class="n">${i+1}${badge}</span><div class="arrows">${chips}</div><span class="tot">${totLabel}</span></div>`;
}
function postitTargetSVG(){

    <!-- post-it -->
    <rect x="50" y="40" width="100" height="100" rx="2" fill="#A8D8EA" stroke="#7EC8E3" stroke-width="1"/>
    <path d="M140 140 L150 130 Q152 140 140 140Z" fill="#8BC4D9"/>
    <!-- punaise -->
    <ellipse cx="100" cy="48" rx="8" ry="5" fill="#ccc" stroke="#999" stroke-width=".7"/>
    <circle cx="100" cy="46" r="4.5" fill="#e0e0e0" stroke="#aaa" stroke-width=".5"/>
    <circle cx="99" cy="45" r="1.5" fill="#fff" opacity=".6"/>
    <!-- trait de crayon (cercle de visée) -->

    <line x1="97" y1="90" x2="103" y2="90" stroke="#333" stroke-width=".8" opacity=".5"/>
    <line x1="100" y1="87" x2="100" y2="93" stroke="#333" stroke-width=".8" opacity=".5"/>

}
function padHTML(se){

  if(se.scoring==="postit"){
    // Post-it : scoring binaire touché/raté
    return `<div style="text-align:center;margin-bottom:16px">${postitTargetSVG()}</div>
      <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px">Tir sur post-it — touché ou raté</div>
      <div class="pad" style="max-width:260px;margin:0 auto">
        <button style="background:var(--accent);color:#000;font-weight:700;font-size:18px;padding:14px 0" onclick="addArrowScore(1)">✓ Touché</button>
        <button class="miss" style="font-size:18px;padding:14px 0" onclick="addArrowScore('M')">✗ Raté</button>
      </div>`;
  }
  if(isManualScoringOnly(se.scoring)){
    // Animal / 3D : saisie libre avec un champ numérique
    return `<div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px">Saisie libre — saisis le score de chaque flèche</div>
      <div class="formgrid"><div class="field"><label>Score</label><input type="number" id="manual-score" min="0" step="1" placeholder="Points"></div>
      <button class="btn primary" onclick="addArrowScore(parseInt($('#manual-score').value)||0);$('#manual-score').value=''">Ajouter</button></div>
      <button class="btn sm" style="margin-top:8px" onclick="addArrowScore('M')">M (raté)</button>`;
  }
  if(maxV>=10) btns.push(`<button class="x" onclick="addArrowScore('X')">X</button>`);
  for(let v=maxV;v>=minV;v--) btns.push(`<button onclick="addArrowScore(${v})" style="color:${zoneColor(v)}">${v}</button>`);
  btns.push(`<button class="miss" onclick="addArrowScore('M')">M</button>`);
  return `<div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px">Saisie rapide — appuie sur le score de chaque flèche</div><div class="pad">${btns.join("")}</div>`;
}
/* ---------- mosaïque hexagonale (facilite le pointage tactile) ---------- */
function hexPoints(cx,cy,s){
  const pts=[];
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-30); // pointy-top
    pts.push(round(cx+s*Math.cos(a),3)+","+round(cy+s*Math.sin(a),3));
  }
  return pts.join(" ");
}
function buildHexCells(R,s){
  const cells=[];
  const hSpacing=Math.sqrt(3)*s, vSpacing=1.5*s;
  const rows=Math.ceil((R+s)/vSpacing)+1, cols=Math.ceil((R+s)/hSpacing)+1;
  for(let row=-rows; row<=rows; row++){
    const cy=row*vSpacing;
    const offset=(Math.abs(row%2)===1)? hSpacing/2 : 0;
    for(let col=-cols; col<=cols; col++){
      const cx=col*hSpacing+offset;
      if(Math.hypot(cx,cy) <= R+s*0.92) cells.push({cx,cy});
    }
  }
  return cells;
}
function hexFaceSVG(se,R){
  const f=faceModel(se.blasonCm,se.scoring);
  const s=f.ringW/(2*Math.sqrt(3));   // 2 rangées d'alvéoles par zone de score (chaque zone garde ses 2 rangées, même quand 2 zones partagent une couleur — ex. bleu = zones 5 et 6)
  const strawR=R+f.ringW;             // double rangée d'alvéoles "paille" au-delà du blason (même épaisseur qu'une zone)
  const straw="#D9C48F";
  const cells=buildHexCells(strawR,s);
  const polys=cells.map(c=>{
    const d=Math.hypot(c.cx,c.cy);
    const fill = d<=R ? zoneHex(scoreFromRadius(d,se.blasonCm,se.scoring).v) : straw;
    return `<polygon class="hexcell" points="${hexPoints(c.cx,c.cy,s)}" fill="${fill}" stroke="#0000002e" stroke-width="${R*0.002}" onclick="hexClickAdd(${round(c.cx,3)},${round(c.cy,3)})"/>`;
  }).join("");
  return { svg:`<clipPath id="hexClip"><circle cx="0" cy="0" r="${strawR}"/></clipPath><g clip-path="url(#hexClip)">${polys}</g>`, strawR };
}
function toggleHexGrid(v){ S.ui.hexGrid=v; saveState(); renderSaisie(); }
function hexClickAdd(cx,cy){
  if(consumeSuppressClick()) return;
  const se=S.seances.find(x=>x.id===S.ui.activeSeanceId); if(!se) return;
  const x=cx, y=-cy; // conversion vers le repère interne (y positif vers le haut)
  const r=Math.hypot(x,y);
  const cb=curBlason(se);
  const sc=scoreFromRadius(r,cb.cm,cb.scoring);
  addArrow({v:sc.v,isX:sc.isX,x:round(x,2),y:round(y,2)});
}

/* ============================================================
   ZOOM / PAN de la cible en saisie — pince, molette, double-tap, boutons.
   La conversion écran→score (getScreenCTM en visée libre, coordonnées figées
   par alvéole en mosaïque) reste exacte à n'importe quel niveau de zoom.
   ============================================================ */
let ZOOM={scale:1,tx:0,ty:0,min:1,max:4};
let ZPOINTERS=new Map(), ZDRAG=null, ZPINCH=null, SUPPRESS_CLICK=false;
function resetZoomState(){ ZOOM.scale=1; ZOOM.tx=0; ZOOM.ty=0; }
function consumeSuppressClick(){ if(SUPPRESS_CLICK){ SUPPRESS_CLICK=false; return true; } return false; }
function applyZoomTransform(){
  const wrap=$("#targetWrap"); if(!wrap) return;
  wrap.style.transform=`translate(${ZOOM.tx}px,${ZOOM.ty}px) scale(${ZOOM.scale})`;
  const hint=$("#zoomHint"); if(hint) hint.style.opacity = ZOOM.scale>1.02 ? '0':'1';
}
function clampPan(){
  const zc=$("#targetZoom"); if(!zc) return;
  const rect=zc.getBoundingClientRect();
  ZOOM.tx=Math.max(rect.width*(1-ZOOM.scale), Math.min(0,ZOOM.tx));
  ZOOM.ty=Math.max(rect.height*(1-ZOOM.scale), Math.min(0,ZOOM.ty));
}
function zoomAt(clientX,clientY,newScale){
  const zc=$("#targetZoom"); if(!zc) return;
  const rect=zc.getBoundingClientRect();
  newScale=Math.max(ZOOM.min,Math.min(ZOOM.max,newScale));
  const localX=(clientX-rect.left-ZOOM.tx)/ZOOM.scale, localY=(clientY-rect.top-ZOOM.ty)/ZOOM.scale;
  ZOOM.tx=(clientX-rect.left)-newScale*localX; ZOOM.ty=(clientY-rect.top)-newScale*localY;
  ZOOM.scale=newScale;
  clampPan(); applyZoomTransform();
}
function zoomStep(factor){
  const zc=$("#targetZoom"); if(!zc) return;
  const rect=zc.getBoundingClientRect();
  zoomAt(rect.left+rect.width/2, rect.top+rect.height/2, ZOOM.scale*factor);
}
function zoomReset(){ resetZoomState(); applyZoomTransform(); }
function setupZoomPan(){
  const zc=$("#targetZoom"); if(!zc) return;
  ZPOINTERS.clear(); ZDRAG=null; ZPINCH=null;
  applyZoomTransform();
  zc.onpointerdown=(e)=>{
    zc.setPointerCapture(e.pointerId);
    ZPOINTERS.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ZPOINTERS.size===1){ ZDRAG={startX:e.clientX,startY:e.clientY,startTx:ZOOM.tx,startTy:ZOOM.ty,moved:false}; }
    else if(ZPOINTERS.size===2){
      ZDRAG=null;
      const pts=[...ZPOINTERS.values()];
      ZPINCH={ startDist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y), startScale:ZOOM.scale,
                midX:(pts[0].x+pts[1].x)/2, midY:(pts[0].y+pts[1].y)/2 };
    }
  };
  zc.onpointermove=(e)=>{
    if(!ZPOINTERS.has(e.pointerId)) return;
    ZPOINTERS.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ZPINCH && ZPOINTERS.size===2){
      const pts=[...ZPOINTERS.values()];
      const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      zoomAt(ZPINCH.midX,ZPINCH.midY,ZPINCH.startScale*(dist/ZPINCH.startDist));
    } else if(ZDRAG && ZPOINTERS.size===1 && ZOOM.scale>1.01){
      const dx=e.clientX-ZDRAG.startX, dy=e.clientY-ZDRAG.startY;
      if(Math.hypot(dx,dy)>5){ ZDRAG.moved=true; zc.classList.add('panning'); }
      ZOOM.tx=ZDRAG.startTx+dx; ZOOM.ty=ZDRAG.startTy+dy;
      clampPan(); applyZoomTransform();
    }
  };
  const endPointer=(e)=>{
    ZPOINTERS.delete(e.pointerId);
    if(ZDRAG && ZDRAG.moved) SUPPRESS_CLICK=true;
    zc.classList.remove('panning');
    if(ZPOINTERS.size<2) ZPINCH=null;
    if(ZPOINTERS.size===0) ZDRAG=null;
  };
  zc.onpointerup=endPointer; zc.onpointercancel=endPointer;
  zc.onwheel=(e)=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, ZOOM.scale*(e.deltaY<0?1.15:1/1.15)); };
  zc.ondblclick=(e)=>{ if(ZOOM.scale>1.05) zoomReset(); else zoomAt(e.clientX,e.clientY,2.6); };
}

function targetSVG(se){
  const f=faceModel(se.blasonCm,se.scoring);
  const R=f.R;
  const useHex = S.ui.hexGrid!==false; // mosaïque hexagonale par défaut
  let rings, vb;
  if(useHex){
    const hx=hexFaceSVG(se,R);
    rings=hx.svg; vb=hx.strawR*1.05;
  } else {
    vb=R*1.06; rings="";
    for(let k=f.zones;k>=1;k--){
      const rOuter=k*f.ringW;
      const sc=11-k; // for 10z: k=10->1 ... k=1->10 ; for 6z: k=6->5 ... k=1->10
      rings+=`<circle cx="0" cy="0" r="${rOuter}" fill="${zoneHex(sc)}" stroke="${sc<=2?'#bbb':'#0004'}" stroke-width="${R*0.004}"/>`;
    }
  }
  // X ring outline (repère visuel, dans les deux modes)
  rings+=`<circle cx="0" cy="0" r="${f.xRadius}" fill="none" stroke="#0006" stroke-width="${R*0.004}"/>`;
  // spider lines
  const cross=`<line x1="${-R*0.05}" y1="0" x2="${R*0.05}" y2="0" stroke="#0007" stroke-width="${R*0.004}"/><line x1="0" y1="${-R*0.05}" x2="0" y2="${R*0.05}" stroke="#0007" stroke-width="${R*0.004}"/>`;
  const dots=CURRENT_END.filter(a=>a.x!=null).map(a=>`<circle cx="${a.x}" cy="${-a.y}" r="${R*0.028}" fill="#111" stroke="#D4943A" stroke-width="${R*0.01}"/>`).join("");
  return `<div class="targetzoom" id="targetZoom">
      <div class="zoomlayer" id="targetWrap"><svg id="targetSVG" viewBox="${-vb} ${-vb} ${vb*2} ${vb*2}">${rings}${cross}${dots}</svg></div>
      <div class="zoomctrls">
        <button type="button" onclick="zoomStep(1.4)">+</button>
        <button type="button" onclick="zoomStep(1/1.4)">–</button>
        <button type="button" onclick="zoomReset()">⟲</button>
      </div>
      <div class="zoomhint" id="zoomHint">🔍 pince / molette pour zoomer</div>
    </div>
    <div class="pills" style="justify-content:center;margin-top:12px">
      <button class="pill ${useHex?'on':''}" onclick="toggleHexGrid(true)">⬡ Mosaïque hexagonale</button>
      <button class="pill ${!useHex?'on':''}" onclick="toggleHexGrid(false)">◎ Visée libre</button>
    </div>
    <div class="tlegend">
      <span><i style="background:#F6D33C"></i>9-10</span><span><i style="background:#E23B2E"></i>7-8</span>
      <span><i style="background:#2FA4DE"></i>5-6</span>${(se.scoring==='10z'||!se.scoring)?'<span><i style="background:#161616;border:1px solid #555"></i>3-4</span><span><i style="background:#EFEBDD"></i>1-2</span>':''}
      ${useHex?'<span><i style="background:#D9C48F"></i>Hors blason</span>':''}
    </div>`;
}
function attachTargetHandlers(se){
  const svg=$("#targetSVG"); if(!svg) return;
  if(S.ui.hexGrid===false){
    // visée libre : conversion via getBoundingClientRect (fiable même sous transform CSS de zoom,
    // contrairement à getScreenCTM qui ignore les transforms d'ancêtres HTML sur certains navigateurs, ex. Safari/iOS)
    const cb=curBlason(se);
    const f=faceModel(cb.cm,cb.scoring);
    const R=f.R, vb=R*1.06; // doit rester identique à la formule utilisée dans targetSVG()
    const handler=(clientX,clientY)=>{
      if(consumeSuppressClick()) return;
      const rect=svg.getBoundingClientRect();
      const relX=(clientX-rect.left)/rect.width, relY=(clientY-rect.top)/rect.height;
      const userX=-vb+relX*vb*2, userY=-vb+relY*vb*2;
      const x=userX, y=-userY; // y up positive
      const r=Math.hypot(x,y);
      const sc=scoreFromRadius(r,cb.cm,cb.scoring);
      addArrow({v:sc.v,isX:sc.isX,x:round(x,2),y:round(y,2)});
    };
    svg.addEventListener("click",e=>handler(e.clientX,e.clientY));
  }
}
function addArrowScore(val){
  const se=S.seances.find(x=>x.id===S.ui.activeSeanceId); if(!se) return;
  let f;
  if(val==='X') f={v:10,isX:true,x:null,y:null};
  else if(val==='M') f={v:0,isX:false,x:null,y:null};
  else f={v:val,isX:false,x:null,y:null};
  addArrow(f);
}
function addArrow(f){
  const se=S.seances.find(x=>x.id===S.ui.activeSeanceId); if(!se) return;
  if(CURRENT_END.length>=se.flechesParVolee){ toast("Volée complète — valide-la"); return; }
  CURRENT_END.push(f);
  renderSaisie();
}
function undoArrow(){ CURRENT_END.pop(); renderSaisie(); }
function validateEnd(){
  const se=S.seances.find(x=>x.id===S.ui.activeSeanceId); if(!se) return;
  if(CURRENT_END.length!==se.flechesParVolee) return;
  // ordre décroissant conventionnel dans la volée
  const fl=[...CURRENT_END].sort((a,b)=>(b.v-a.v)||((b.isX?1:0)-(a.isX?1:0)));
  const cb = curBlason(se);
  const volee = {fleches:fl};
  // Stocker le blason de cette volée si différent du défaut de la séance
  if(cb.id !== se.blasonId){ volee.blasonId=cb.id; volee.blasonCm=cb.cm; volee.scoring=cb.scoring; }
  se.volees.push(volee);
  CURRENT_END=[]; saveState();
  if(se.volees.length>=se.nbVolees){ toast("Dernière volée enregistrée 🎯"); }
  renderSaisie();
}
function finishSeance(){
  const se=S.seances.find(x=>x.id===S.ui.activeSeanceId);
  CURRENT_END=[];
  if(se && !flatArrows(se).length && !(se.exercices||[]).length){
    toast("Séance vide supprimée"); S.seances=S.seances.filter(x=>x.id!==se.id);
  } else if(se){ toast("Séance terminée"); }
  S.ui.activeSeanceId=null; S.ui.seanceTab="resume";
  saveState(); setView("saisie");
}

/* ---------- VUE ANALYSE ---------- */
function openAnalyse(id){ S.ui.analyseId=id; saveState(); setView("analyse"); }
function renderAnalyse(){

  const filt=S.ui.analyseFilt||{};

  if(filt.dateTo) pool=pool.filter(s=>s.date<=filt.dateTo);
  if(filt.type==='compté') pool=pool.filter(s=>s.volees.length>0);
  if(filt.type==='exercice') pool=pool.filter(s=>(s.exercices||[]).length>0);
  if(filt.exerciceId) pool=pool.filter(s=>(s.exercices||[]).some(e=>e.exerciceId===filt.exerciceId));
  if(filt.arcId) pool=pool.filter(s=>s.arcId===filt.arcId);

  const arcOpts=S.materiel.arcs.map(a=>`<option value="${a.id}" ${filt.arcId===a.id?'selected':''}>${esc(a.nom)}</option>`).join('');

  el.innerHTML=`

      <div class="eyebrow" style="margin-bottom:10px">Filtrer les séances</div>

        <div class="field"><label>Au</label><input type="date" value="${filt.dateTo||''}" onchange="setAnalyseFilter('dateTo',this.value)"></div>
        <div class="field"><label>Type</label><select onchange="setAnalyseFilter('type',this.value)"><option value="">Tous</option><option ${filt.type==='compté'?'selected':''} value="compté">Tir compté</option><option ${filt.type==='exercice'?'selected':''} value="exercice">Avec exercice(s)</option></select></div>
        <div class="field"><label>Exercice</label><select onchange="setAnalyseFilter('exerciceId',this.value)"><option value="">Tous</option>${exOpts}</select></div>
        ${arcOpts?`<div class="field"><label>Arc</label><select onchange="setAnalyseFilter('arcId',this.value)"><option value="">Tous</option>${arcOpts}</select></div>`:''}

        if(allPostit(se)) return `<div class="metric accent"><div class="lab">Touchés</div><div class="val">${st.total}<small>/${st.n}</small></div></div>
